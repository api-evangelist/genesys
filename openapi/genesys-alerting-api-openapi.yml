            service.unavailable: Service Unavailable - The server is currently unavailable (because it is overloaded or down for maintenance).
        '504':
          description: The request timed out.
          schema:
            $ref: '#/definitions/ErrorBody'
          x-inin-error-codes:
            authentication.request.timeout: Authentication request timeout.
            request.timeout: The request timed out.
      security:
      - PureCloud OAuth:
        - alerting
      x-inin-requires-permissions:
        type: ALL
        permissions:
        - alerting:rule:add
      x-purecloud-method-name: postAlertingRules
definitions:
  AlertRuleProperties:
    type: object
    required:
    - type
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
        description: The name of the object.
        readOnly: true
      type:
        type: string
        description: The type of rule being alerted.
        readOnly: true
        enum:
        - ConversationMetrics
        - UserPresence
        - WorkforceManagement
        - OperationalConsole
        - Unknown
  AddressableEntityRef:
    type: object
    properties:
      id:
        type: string
      selfUri:
        type: string
        format: uri
  AlertListing:
    type: object
    properties:
      entities:
        type: array
        items:
          $ref: '#/definitions/CommonAlert'
      pageSize:
        type: integer
        format: int32
      pageNumber:
        type: integer
        format: int32
      total:
        type: integer
        format: int64
      firstUri:
        type: string
        format: uri
      nextUri:
        type: string
        format: uri
      previousUri:
        type: string
        format: uri
      lastUri:
        type: string
        format: uri
      selfUri:
        type: string
        format: uri
      pageCount:
        type: integer
        format: int32
  CommonRuleConditions:
    type: object
    required:
    - predicates
    - type
    properties:
      clauses:
        type: array
        description: The list of predicates groups to be evaluated
        items:
          $ref: '#/definitions/CommonRuleConditions'
      predicates:
        type: array
        description: The list of rule metric predicates to be evaluated.
        items:
          $ref: '#/definitions/CommonRulePredicate'
      type:
        type: string
        description: the logic operator performed.
        enum:
        - And
        - Or
        - Not
      id:
        type: string
        description: The id.
  CommonAllAlertUpdateRequest:
    type: object
    required:
    - type
    properties:
      type:
        type: string
        description: The action to take
        enum:
        - Mute
        - Snooze
        - Unread
        - Close
      unread:
        description: The fields need for an unread update requests
        $ref: '#/definitions/UnreadFields'
  AlertRequest:
    type: object
    required:
    - type
    properties:
      type:
        type: string
        description: The action being taken on the alert.
        enum:
        - Mute
        - Snooze
        - Unread
        - Close
      dateStart:
        type: string
        format: date-time
        description: 'The start date of the mute/snooze period. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      dateEnd:
        type: string
        format: date-time
        description: 'The end date of the mute/snooze period. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      unread:
        description: The fields need for an unread update requests
        $ref: '#/definitions/UnreadFields'
      validRequest:
        type: boolean
  UserReference:
    type: object
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  CommonRuleBulkDeleteRequest:
    type: object
    required:
    - ruleIds
    properties:
      ruleIds:
        type: array
        description: The user supplied rule ids to be deleted
        items:
          type: string
  CommonRuleContainer:
    type: object
    properties:
      entities:
        type: array
        items:
          $ref: '#/definitions/CommonRule'
      pageSize:
        type: integer
        format: int32
      pageNumber:
        type: integer
        format: int32
      total:
        type: integer
        format: int64
      firstUri:
        type: string
        format: uri
      nextUri:
        type: string
        format: uri
      previousUri:
        type: string
        format: uri
      lastUri:
        type: string
        format: uri
      selfUri:
        type: string
        format: uri
      pageCount:
        type: integer
        format: int32
  CommonRule:
    type: object
    required:
    - name
    - type
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
        description: Name of the rule
      description:
        type: string
        description: The description of the rule.
      enabled:
        type: boolean
        description: Indicates if the rule is enabled.
      notifications:
        type: array
        description: The alert notification types to trigger when alarm state changes as well as the users they will be sent to.
        uniqueItems: true
        items:
          $ref: '#/definitions/AlertNotification'
      sendExitingAlarmNotifications:
        type: boolean
        description: Indicates if the alert will send a notification when it is closed.
      waitBetweenNotificationMs:
        type: integer
        format: int64
        description: The amount of time in milliseconds to wait between notification.
      conditions:
        description: The set of metric conditions that would trigger an alert.
        $ref: '#/definitions/CommonRuleConditions'
      type:
        type: string
        description: The type of the rule.
        enum:
        - ConversationMetrics
        - UserPresence
        - WorkforceManagement
        - OperationalConsole
        - Unknown
      inAlarm:
        type: boolean
        description: Indicates if the rule is in alarm state.
      user:
        description: The entity that created the rule.
        $ref: '#/definitions/UserReference'
      version:
        type: integer
        format: int32
        description: The current version number of the rule.
      dateCreated:
        type: string
        format: date-time
        description: 'The creation date of the rule when the rule was created. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      dateLastModified:
        type: string
        format: date-time
        description: 'The timestamp of the last update to the rule. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  ModifiableRuleProperties:
    type: object
    required:
    - name
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
        description: Name of the rule
      description:
        type: string
        description: The description of the rule.
      enabled:
        type: boolean
        description: Indicates if the rule is enabled.
      notifications:
        type: array
        description: The alert notification types to trigger when alarm state changes as well as the users they will be sent to.
        uniqueItems: true
        items:
          $ref: '#/definitions/AlertNotification'
      sendExitingAlarmNotifications:
        type: boolean
        description: Indicates if the alert will send a notification when it is closed.
      waitBetweenNotificationMs:
        type: integer
        format: int64
        description: The amount of time in milliseconds to wait between notification.
      conditions:
        description: The set of metric conditions that would trigger an alert.
        $ref: '#/definitions/CommonRuleConditions'
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  AlertNotification:
    type: object
    required:
    - notificationTypes
    - recipient
    properties:
      recipient:
        type: string
        description: The entity to receive the notification.
      notificationTypes:
        type: array
        description: The notification types the user will receive.
        uniqueItems: true
        items:
          type: string
          enum:
          - Sms
          - Device
          - Email
          - Push
      locale:
        type: string
        description: The locale whose language will be used when sending alerts.  Locale should be in theformat language_COUNTRY where language is always lower case and country is always upper case.
  ErrorBody:
    type: object
    properties:
      message:
        type: string
      code:
        type: string
      status:
        type: integer
        format: int32
      entityId:
        type: string
      entityName:
        type: string
      messageWithParams:
        type: string
      messageParams:
        type: object
        additionalProperties:
          type: string
      contextId:
        type: string
      details:
        type: array
        items:
          $ref: '#/definitions/Detail'
      errors:
        type: array
        items:
          $ref: '#/definitions/ErrorBody'
      limit:
        $ref: '#/definitions/Limit'
  AlertSummary:
    type: object
    required:
    - entities
    - entitiesAreTeamMembers
    - metricType
    properties:
      entities:
        type: array
        description: The entities who violated the rule condition over the duration of the alert.
        items:
          $ref: '#/definitions/AlertSummaryEntity'
      conversation:
        description: The id of the conversation that triggered the alert.  Only used for alerts based on instance-based conversation metrics.
        $ref: '#/definitions/AddressableEntityRef'
      metricType:
        type: string
        description: The metric type that is monitored.
        enum:
        - Interval
        - Instance
      entitiesAreTeamMembers:
        type: boolean
        description: Flag that indicated whether or not the alert is for a rule with a condition for all members of a team.
  GetAlertQuery:
    type: object
    required:
    - queryType
    - ruleType
    properties:
      ruleType:
        type: string
        description: The rule type of the alerts the query will return
        enum:
        - Conversation
        - Presence
        - All
      queryType:
        type: string
        description: The type of query being performed.
        enum:
        - Info
        - Count
      alertStatus:
        type: string
        description: The status of the alerts the query will return.
        enum:
        - Active
        - Inactive
        - All
      viewedStatus:
        type: string
        description: The view status of the alerts the query will return.
        enum:
        - Unread
        - Read
        - All
      pageNumber:
        type: integer
        format: int32
        description: The page number of the queried response
      pageSize:
        type: integer
        format: int32
        description: The number of entities to return of the queried response.  The max is 25
      sortBy:
        type: string
        description: The field to sort responses by.  The accepted choices are Name and DateStart
        enum:
        - Name
        - DateStart
      sortOrder:
        type: string
        description: The order in which response will be sorted.  The accepted choices are Asc and Desc
        enum:
        - Asc
        - Desc
  BulkResponse:
    type: object
    properties:
      results:
        type: array
        description: A list of the results from the bulk operation.
        items:
          $ref: '#/definitions/BulkResult'
      errorCount:
        type: integer
        format: int32
        description: The number of errors from the bulk operation.
      errorIndexes:
        type: array
        description: An index of where the errors are in the listing.
        items:
          type: integer
          format: int32
  GetRulesQuery:
    type: object
    required:
    - queryType
    - ruleType
    properties:
      ruleType:
        type: string
        description: The rule type of the alerts the query will return
        enum:
        - Conversation
        - Presence
        - All
      queryType:
        type: string
        description: The type of query being performed.
        enum:
        - Info
        - Count
      enabledType:
        type: string
        description: The state of the rule the query will return.  The accepted choices are Enabled, Disabled, or All
        enum:
        - Enabled
        - Disabled
        - All
      pageNumber:
        type: integer
        format: int32
        description: The page number of the queried response
      pageSize:
        type: integer
        format: int32
        description: The number of entities to return of the queried response.  The max is 25
      sortBy:
        type: string
        description: The field to sort responses by.  The accepted choices are Name and DateStart
        enum:
        - Name
        - DateCreated
      sortOrder:
        type: string
        description: The order in which response will be sorted.  The accepted choices are Asc and Desc
        enum:
        - Asc
        - Desc
      ruleName:
        type: string
        description: The name of the rule being queries.
      nameSearchType:
        type: string
        description: Specifies how strict the name search needs to be. Expected values are Exact and Contains if querying by name.
        enum:
        - Exact
        - Contains
        - Unknown
  AlertingUnreadStatus:
    type: object
    required:
    - unread
    properties:
      unread:
        type: boolean
        description: True is alert is unread, false if it has not been.
  UnreadFields:
    type: object
    required:
    - state
    properties:
      state:
        type: boolean
        description: The new unread state of the alert
  CommonRuleBulkUpdateNotificationsRequest:
    type: object
    required:
    - ruleIds
    properties:
      ruleIds:
        type: array
        description: The user supplied rules ids to be updated
        uniqueItems: true
        items:
          type: string
      properties:
        description: The rule properties to be updated
        $ref: '#/definitions/ModifiableRuleProperties'
      typesToAdd:
        type: array
        description: Collection of alerting notification types to add for all entities in the rules
        uniqueItems: true
        items:
          type: string
          enum:
          - Sms
          - Device
          - Email
          - Push
      typesToRemove:
        type: array
        description: Collection of alerting notification types to remove for all entities in the rules
        uniqueItems: true
        items:
          type: string
          enum:
          - Sms
          - Device
          - Email
          - Push
  MuteSnoozeFields:
    type: object
    required:
    - dateEnd
    - dateStart
    properties:
      dateStart:
        type: string
        format: date-time
        description: 'The start date of the mute/snooze period. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      dateEnd:
        type: string
        format: date-time
        description: 'The end date of the mute/snooze period. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
  CommonRulePredicate:
    type: object
    required:
    - comparisonOperator
    - entity
    - metric
    - metricType
    - metricValueType
    - value
    properties:
      metricType:
        type: string
        description: The type of metric being evaluated.
        enum:
        - Interval
        - Instance
      metricValueType:
        type: string
        description: The type of metric value being evaluated.
        enum:
        - Count
        - Min
        - Timer
        - Max
        - Percentage
        - Average
        - Observation
      comparisonOperator:
        type: string
        description: The comparison operator being performed on the metric.
        enum:
        - Gt
        - Gte
        - Lt
        - Lte
        - Eq
        - Ne
      value:
        type: number
        format: double
        description: The value the metric will be compared to.
      status:
        type: string
        description: The status of the entity corresponding to the metric.
      topic:
        type: string
        description: The operational console topic corresponding to the metric.
      entity:
        description: The entity whose metric is being represented.
        $ref: '#/definitions/CommonRulePredicateEntity'
      mediaType:
        type: string
        description: The media type of the conversation the metric describes.
        enum:
        - Voice
        - Chat
        - Email
        - Callback
        - Message
      metric:
        type: string
        description: The metric being evaluated.
        enum:
        - nAbandon
        - nConnected
        - nInteractions
        - nOffered
        - nOutbound
        - nTransferred
        - serviceLevel
        - oServiceLevel
        - oWaiting
        - tAbandon
        - tAcw
        - tAlert
        - tAnswered
        - tHandle
        - tHeldComplete
        - tTalkComplete
        - tWait
        - tTalk
        - tHeld
        - tOrganizationPresence
        - tSystemPresence
        - tAgentRoutingStatus
        - oUserRoutingStatuses
        - oUserPresences
        - oInteracting
        - tFlowOut
        - tAdherenceStatus
        - nEvents
  Empty:
    type: object
  AlertSummaryEntity:
    type: object
    required:
    - alerting
    - entityType
    properties:
      entityType:
        type: string
        description: Specifies the type of entity being evaluated
        enum:
        - User
        - Group
        - Queue
        - Team
        - TeamMembers
        - Organization
      user:
        description: User id of the entity being monitored
        $ref: '#/definitions/AddressableEntityRef'
      group:
        description: Group id of the entity being monitored
        $ref: '#/definitions/AddressableEntityRef'
      queue:
        description: Queue id of the entity being monitored
        $ref: '#/definitions/AddressableEntityRef'
      team:
        description: Team id of the entity being monitored
        $ref: '#/definitions/AddressableEntityRef'
      alerting:
        type: boolean
        description: Flag that indicated if the entity is current causing the alert to be triggered
  BulkResult:
    type: object
    properties:
      error:
        description: Error details if the operation failed.
        $ref: '#/definitions/BulkError'
      entity:
        type: object
        description: The result of the operation if it succeeded.
  Limit:
    type: object
    properties:
      key:
        type: string
      namespace:
        type: string
        enum:
        - web.deployments
        - web.messaging
        - agent.assistant
        - agentic.virtual.agents
        - analytics.agents
        - analytics.alerting
        - analytics.data.extraction
        - analytics
        - analytics.realtime
        - analytics.reporting.settings
        - anomaly.detection
        - architect
        - audiohook
        - audiohook.monitor
        - audit
        - auth.api
        - authorization
        - automation.testing
        - bots
        - bots.voice
        - business.rules
