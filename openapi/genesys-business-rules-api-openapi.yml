definitions:
  Items:
    type: object
    properties:
      type:
        type: string
      pattern:
        type: string
  UpdateRowIndexRequest:
    type: object
    required:
    - rowId
    - rowIndex
    properties:
      rowId:
        type: string
        description: The row UUID.
      rowIndex:
        type: integer
        format: int32
        description: The updated row index. Must be an integer value greater than or equal to 1. Must be less than or equal to x, where x is the number of rows in the decision table version.
  DecisionTableVersion:
    type: object
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
      division:
        description: The division to which this entity belongs.
        $ref: '#/definitions/Division'
      version:
        type: integer
        format: int32
        description: The decision table version.
      status:
        type: string
        description: Current status of this decision table version
        enum:
        - Draft
        - Published
        - Error
        - Preparing
        - Superseded
      description:
        type: string
        description: The decision table description.
      rowCount:
        type: integer
        format: int32
        description: The number of rows in this decision table version.
      rowsUri:
        type: string
        description: The rows URI for this decision table version.
      dateCreated:
        type: string
        format: date-time
        description: 'UTC date time indicating when this decision table version was created. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        readOnly: true
      dateModified:
        type: string
        format: date-time
        description: 'UTC date time indicating when this decision table version was last updated. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        readOnly: true
      datePublished:
        type: string
        format: date-time
        description: 'UTC date time indicating when this decision table version was published. Null if never published. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        readOnly: true
      columns:
        description: The column definitions of this decision table version.
        $ref: '#/definitions/DecisionTableColumns'
      contract:
        description: The contract information for this decision table version.
        $ref: '#/definitions/DecisionTableContract'
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  AddressableEntityRef:
    type: object
    properties:
      id:
        type: string
      selfUri:
        type: string
        format: uri
  DecisionTableImportJob:
    type: object
    required:
    - importMode
    - status
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      tableVersion:
        type: integer
        format: int32
        description: The table version to be replaced by this import
      status:
        type: string
        description: Current status of the import job
        enum:
        - Uploading
        - Processing
        - Complete
        - Failed
        - Cancelled
      uploadUrl:
        type: string
        description: Pre-signed URL to upload the import file (PUT)
      uploadHeaders:
        type: object
        description: Headers required when uploading file with data to be imported to uploadUrl
        additionalProperties:
          type: string
      importMode:
        type: string
        description: Whether rows are appended to existing rows or rows are replaced
        enum:
        - Append
        - Replace
      fileName:
        type: string
        description: Original file name supplied when the job was created, including the file extension
      createdBy:
        description: The user who created the job
        readOnly: true
        $ref: '#/definitions/AddressableEntityRef'
      dateCreated:
        type: string
        format: date-time
        description: 'When the job was created. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      dateModified:
        type: string
        format: date-time
