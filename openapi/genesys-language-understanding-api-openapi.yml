          format: int32
          description: Number of unique phrases (sub-utterances) where a topic has occurred.
          readOnly: true
        phrases:
          type: array
          description: The phrases that are extracted for a topic.
          items:
            type: string
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
