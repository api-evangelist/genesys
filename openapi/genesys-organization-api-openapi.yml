definitions:
  Organization:
    type: object
    required:
    - version
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
      defaultLanguage:
        type: string
        description: 'The default language for this organization. Example: ''en'''
      defaultCountryCode:
        type: string
        description: 'The default country code for this organization. Example: ''US'''
      thirdPartyOrgName:
        type: string
        description: The short name for the organization. This field is globally unique and cannot be changed.
        readOnly: true
      thirdPartyURI:
        type: string
        format: uri
      domain:
        type: string
      features:
        type: object
        description: The state of features available for the organization.
        readOnly: true
        additionalProperties:
          type: boolean
      version:
        type: integer
        format: int32
        description: The current version of the organization.
      state:
        type: string
        description: The current state. Examples are active, inactive, deleted.
        enum:
        - active
        - inactive
        - deleted
      defaultSiteId:
        type: string
      supportURI:
        type: string
        description: Email address where support tickets are sent to.
      voicemailEnabled:
        type: boolean
      productPlatform:
        type: string
        description: Organizations Originating Platform.
        readOnly: true
        enum:
        - GenesysCloud
        - PureCloud
        - PureEngage
        - PureEngageCloud
        - PureConnect
        - PureConnectCloud
        - Unknown
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  PasswordRequirements:
    type: object
    properties:
      minimumLength:
        type: integer
        format: int32
      minimumDigits:
        type: integer
        format: int32
      minimumLetters:
        type: integer
        format: int32
      minimumUpper:
        type: integer
        format: int32
      minimumLower:
        type: integer
        format: int32
      minimumSpecials:
        type: integer
        format: int32
      minimumAgeSeconds:
        type: integer
        format: int32
      expirationDays:
        type: integer
        format: int32
  ErrorBody:
    type: object
    properties:
      message:
        type: string
      code:
        type: string
      status:
        type: integer
        format: int32
      entityId:
        type: string
      entityName:
        type: string
      messageWithParams:
        type: string
      messageParams:
        type: object
        additionalProperties:
          type: string
      contextId:
        type: string
      details:
        type: array
        items:
          $ref: '#/definitions/Detail'
      errors:
        type: array
        items:
          $ref: '#/definitions/ErrorBody'
      limit:
        $ref: '#/definitions/Limit'
  FreeTrialNamespace:
    type: object
    properties:
      name:
        type: string
      friendlyName:
        type: string
      limits:
        type: array
        items:
          $ref: '#/definitions/FreeTrialLimit'
  NamespaceDocs:
    type: object
    properties:
      name:
        type: string
      friendlyName:
