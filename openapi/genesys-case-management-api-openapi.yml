        maxLength: 256
      nameSearchType:
        type: string
        description: Type of name search to perform. Default is BEGINS_WITH.
        enum:
        - BEGINS_WITH
        - CONTAINS
      divisionIds:
        type: array
        description: Divisions to filter by. Accepts a list of UUIDs and/or '*'.
        items:
          type: string
      filters:
        type: array
        description: 'List of filter objects to be used in the search. Valid filter names are: ''id'', ''name'', ''divisionId''. Multiple filters are combined with AND logic.'
        items:
          $ref: '#/definitions/CaseplanFilter'
        maxItems: 3
        minItems: 0
      attributes:
        type: array
        description: List of entity attributes to be retrieved in the result.
        items:
          type: string
      pageSize:
        type: integer
        format: int32
        description: Number of results per page. Maximum is 200. Default is 25.
        minimum: 1
        maximum: 200
      after:
        type: string
        description: Cursor for pagination. Use the "after" value from the previous response.
