definitions:
  SegmentAssignmentSegment:
    type: object
    required:
    - id
    properties:
      id:
        type: string
        description: The ID of the segment.
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  OutcomeQuantileCondition:
    type: object
    required:
    - maxQuantileThreshold
    - outcomeId
    properties:
      outcomeId:
        type: string
        description: The outcome ID.
      maxQuantileThreshold:
        type: number
        format: float
        description: This Outcome Quantile Condition is met when sessionMaxQuantile of the OutcomeScore is above this value, (unless fallbackQuantile is set). Range 0.00-1.00
      fallbackQuantileThreshold:
        type: number
        format: float
        description: (Optional) If set, this Condition is met when maxQuantileThreshold is met, AND the current quantile of the OutcomeScore is below this fallbackQuantileThreshold. Range 0.00-1.00
  ExternalEventIdentifiers:
    type: object
    required:
    - externalIds
    properties:
      externalIds:
        type: array
        description: The list of identifiers of the contact
        items:
          $ref: '#/definitions/ExternalEventExternalId'
        maxItems: 1
        minItems: 1
  JourneyEventDefinition:
    type: object
    required:
    - description
    - jsonSchema
    - name
    - source
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
        description: The name of the event definition
        readOnly: true
      source:
        type: string
        description: The source of the event definition
        readOnly: true
        enum:
        - Native
        - External
      rank:
        type: integer
        format: int32
        description: The rank of the event definition
        readOnly: true
      displayName:
        type: string
        description: The display name of the event definition
        readOnly: true
      description:
        type: string
        description: The description of this event definition
        readOnly: true
      jsonSchema:
        description: The JSON schema of this event definition
        readOnly: true
        $ref: '#/definitions/JsonSchemaDocument'
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
    description: An event definition used when creating journey views
  ExternalEvent:
    type: object
    required:
    - attributes
    - dateCreated
    - id
    - identifiers
    properties:
      id:
        type: string
        description: The ID of the event.
      dateCreated:
        type: string
        format: date-time
        description: 'Timestamp indicating when the event actually took place. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      identifiers:
        description: The identifiers of the contact the event is for.
        $ref: '#/definitions/ExternalEventIdentifiers'
      attributes:
        type: object
        description: The event attributes.
        additionalProperties:
          type: object
  AddressableEntityRef:
    type: object
    properties:
      id:
        type: string
      selfUri:
        type: string
        format: uri
  UnprocessedSegmentAssignments:
    type: object
    required:
    - count
    properties:
      assign:
        description: The segment assignments to apply.
        $ref: '#/definitions/SegmentAssignments'
      unassign:
        description: The segment unassignments to apply.
        $ref: '#/definitions/SegmentUnassignments'
      count:
        type: integer
        format: int32
        description: The total number of segment assignments and unassignments that were not successfully processed.
  JsonSchemaDocument:
    type: object
    properties:
      id:
        type: string
      $schema:
        type: string
      title:
        type: string
      description:
        type: string
      type:
        type: string
      required:
        type: array
        items:
          type: string
      properties:
        type: object
        additionalProperties:
          type: object
      additionalProperties:
        type: object
    description: A JSON Schema document.
  JourneyViewSchedule:
    type: object
    required:
    - dateModified
    - frequency
    - user
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      frequency:
        type: string
        description: Frequency of execution
        enum:
        - Daily
        - Weekly
        - Monthly
      dateModified:
        type: string
        format: date-time
        description: 'Timestamp of last update. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        readOnly: true
      user:
        description: Last modified user
        readOnly: true
        $ref: '#/definitions/AddressableEntityRef'
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  ActionEventRequest:
    type: object
    required:
    - actionId
    - actionState
    - sessionId
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      sessionId:
        type: string
        description: UUID of the customer session for this action.
      actionId:
        type: string
        description: UUID for the action, as returned by the Ping endpoint when the action was qualified.
      actionState:
        type: string
        description: State the action is transitioning to.
        enum:
        - accepted
        - rejected
        - timedout
        - errored
        - ignored
        - qualified
        - offered
        - started
        - engaged
        - qualifiedOutsideSchedule
        - offeredOutsideSchedule
        - abandoned
        - completed
        - frequencyCapReached
      errorCode:
        type: string
        description: Client defined error code (when state transitions to errored)
      errorMessage:
        type: string
        description: Message of the error returned when the action fails (when state transitions to errored)
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  SegmentAssignment:
    type: object
    required:
    - dateAssigned
    - dateForUnassignment
    - externalContact
    - segment
    properties:
      dateAssigned:
        type: string
        format: date-time
        description: 'Date when the segment was assigned. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      dateForUnassignment:
        type: string
        format: date-time
        description: 'Date indicating when a segment is scheduled to be unassigned. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      segment:
        description: The segment the assignment is for.
        $ref: '#/definitions/SegmentAssignmentSegment'
      externalContact:
        description: External contact of the customer to which the segment is assigned.
        $ref: '#/definitions/AddressableEntityRef'
      session:
        description: For session-scoped segments, the session for which the segment was assigned.
        $ref: '#/definitions/SegmentAssignmentSession'
  AsyncQueryStatus:
    type: object
    properties:
      state:
        type: string
        description: The current state of the asynchronous query
        enum:
        - QUEUED
        - PENDING
        - FAILED
        - CANCELLED
        - FULFILLED
        - EXPIRED
      errorMessage:
        type: string
        description: The error associated with the current query, if the state is FAILED
      expirationDate:
        type: string
        format: date-time
        description: 'The time at which results for this query will expire. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      submissionDate:
        type: string
        format: date-time
        description: 'The time at which the query was submitted. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      completionDate:
        type: string
        format: date-time
        description: 'The time at which the query completed. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
  PatchCloseButtonStyleProperties:
    type: object
    properties:
      color:
        type: string
        description: 'Color of button. (eg. #FF0000)'
      opacity:
        type: number
        format: float
        description: Opacity of button.
  CustomEventAttribute:
    type: object
    required:
    - dataType
    - value
    properties:
      dataType:
        type: string
        description: The data type of the custom attribute.
      value:
        type: string
        description: The value of the custom attribute.
  StatisticalResponse:
    type: object
    properties:
      interval:
        type: string
      metrics:
        type: array
        items:
          $ref: '#/definitions/AggregateMetricData'
      views:
        type: array
        items:
          $ref: '#/definitions/AggregateViewData'
  JourneyViewResult:
    type: object
    properties:
      elements:
        type: array
        description: The elements within the journey view result
        readOnly: true
        items:
          $ref: '#/definitions/JourneyViewResultElement'
      charts:
        type: array
        description: The chart results within the journey view result
        readOnly: true
        items:
          $ref: '#/definitions/JourneyViewChartResult'
    description: A journey view result
  ActionMapAction:
    type: object
    properties:
      actionTemplate:
        description: Action template associated with the action map.
        $ref: '#/definitions/ActionMapActionTemplate'
      mediaType:
        type: string
        description: Media type of action.
        enum:
        - webchat
        - webMessagingOffer
        - contentOffer
        - integrationAction
        - architectFlow
        - openAction
      actionTargetId:
        type: string
        description: Deprecated. Action target ID.
      isPacingEnabled:
        type: boolean
        description: Deprecated. Whether this action should be throttled.
      props:
        description: Deprecated. Additional properties.
        $ref: '#/definitions/ActionProperties'
      architectFlowFields:
        description: Architect Flow Id and input contract.
        $ref: '#/definitions/ArchitectFlowFields'
      webMessagingOfferFields:
        description: Admin-configurable fields of a web messaging offer action.
        $ref: '#/definitions/WebMessagingOfferFields'
      openActionFields:
        description: Admin-configurable fields of an open action.
        $ref: '#/definitions/OpenActionFields'
  AggregateViewData:
    type: object
    properties:
      name:
        type: string
      stats:
        $ref: '#/definitions/StatisticalSummary'
  PatchActionTarget:
    type: object
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
      serviceLevel:
        description: Service Level of the action target. Chat offers for the target will be throttled with the aim of achieving this service level.
        $ref: '#/definitions/ServiceLevel'
      shortAbandonThreshold:
        type: integer
        format: int32
        description: Indicates the non-default short abandon threshold
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  JourneyViewLink:
    type: object
    required:
    - id
    properties:
      id:
        type: string
        description: The identifier of the element downstream
      constraintWithin:
        description: A time constraint on this link, which requires a customer to complete the downstream element within this amount of time to be counted.
        $ref: '#/definitions/JourneyViewLinkTimeConstraint'
      constraintAfter:
        description: A time constraint on this link, which requires a customer must complete the downstream element after this amount of time to be counted.
        $ref: '#/definitions/JourneyViewLinkTimeConstraint'
      eventCountType:
        type: string
        description: 'The type of events that will be counted. Note: Concurrent will override any JourneyViewLinkTimeConstraint. Default is Sequential.'
        enum:
        - All
        - Concurrent
        - Sequential
      joinAttributes:
        type: array
        description: Other (secondary) attributes on which this link should join the customers being counted
        items:
          type: string
    description: A link between elements in a journey view
  JourneyViewElementFilter:
    type: object
    required:
    - type
    properties:
      type:
        type: string
        description: 'Boolean operation to apply to the provided predicates and clauses. Valid values: And'
        enum:
        - And
      predicates:
        type: array
        description: predicates
        items:
          $ref: '#/definitions/JourneyViewElementFilterPredicate'
      numberPredicates:
        type: array
        description: numberPredicates
        items:
          $ref: '#/definitions/JourneyViewElementFilterNumberPredicate'
    description: A set of filters on an element within a journey view
  EventSession:
    type: object
    required:
    - id
    - type
    properties:
      id:
        type: string
        description: The ID of the session.
      selfUri:
        type: string
        format: uri
      type:
        type: string
        description: Session types indicate the type or category of sessions (e.g. web, app).
  EventListing:
    type: object
    properties:
      entities:
        type: array
        items:
          $ref: '#/definitions/Event'
      nextUri:
        type: string
      selfUri:
        type: string
      previousUri:
        type: string
  StatisticalSummary:
    type: object
    properties:
      max:
        type: number
      min:
        type: number
      count:
        type: integer
        format: int64
      countNegative:
        type: integer
        format: int64
      countPositive:
        type: integer
        format: int64
      sum:
        type: number
      current:
        type: number
      ratio:
        type: number
      numerator:
        type: number
      denominator:
        type: number
      target:
        type: number
      p95:
        type: integer
        format: int64
      p99:
        type: integer
        format: int64
      calculatedMetricValue:
        type: integer
        format: int64
  PatchSurveyQuestion:
    type: object
    required:
    - label
    properties:
      type:
        type: string
        description: Type of survey question.
        enum:
        - text
        - hidden
        - select
        - checkbox
        - textarea
      label:
        type: string
        description: Label of question.
      customerProperty:
        type: string
        description: The customer property that the answer maps to.
        enum:
        - givenName
        - familyName
        - email
        - phone
        - gender
        - companyName
      choices:
        type: array
        description: Choices available to user.
        items:
          type: string
      isMandatory:
        type: boolean
        description: Whether answering this question is mandatory.
  SdkLibrary:
    type: object
    required:
    - name
    - version
    properties:
      name:
        type: string
        description: The name of the SDK.
      version:
        type: string
        description: The version of the SDK.
  FlowPathsFlowDetails:
    type: object
    required:
    - count
    - flow
    - type
    - version
    properties:
      flow:
        description: The identifier of the flow.
        $ref: '#/definitions/AddressableEntityRef'
      version:
        type: string
        description: The version of the flow.
      type:
        type: string
        description: The type of the flow.
        enum:
        - DigitalBot
        - Bot
        - InboundCall
        - SecureCall
        - InboundShortMessage
        - InboundEmail
        - OutboundCall
      count:
        type: integer
