components:
  schemas:
    Contact:
      type: object
      properties:
        address:
          type: string
          description: Email address or phone number for this contact type
        display:
          type: string
          description: Formatted version of the address property
          readOnly: true
        mediaType:
          type: string
          enum:
          - PHONE
          - EMAIL
          - SMS
        type:
          type: string
          enum:
          - PRIMARY
          - WORK
          - WORK2
          - WORK3
          - WORK4
          - HOME
          - MOBILE
          - MAIN
          - OTHER
        extension:
          type: string
          description: Use internal extension instead of address. Mutually exclusive with the address field.
        countryCode:
          type: string
        integration:
          type: string
          example: microsoftteams
          description: Integration tag value if this number is associated with an external integration.
    Image:
      type: object
      properties:
        resolution:
          type: string
          description: 'Height and/or width of image. ex: 640x480 or x128'
        imageUri:
          type: string
    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Message string of the validation error.
        errorType:
          type: string
          description: Type of validation errror.
        arguments:
          type: object
          description: Map of argument names to corresponding values. Used for localization.
          additionalProperties:
            type: string
    DomainOrganizationRoleCreate:
      type: object
      required:
      - name
      properties:
        id:
          type: string
          description: role id
        name:
          type: string
          description: The role name
        description:
          type: string
        defaultRoleId:
          type: string
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        unusedPermissions:
          type: array
          description: A collection of the permissions the role is not using
          readOnly: true
          uniqueItems: true
          items:
            type: string
        permissionPolicies:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DomainPermissionPolicy'
        userCount:
          type: integer
          format: int32
        roleNeedsUpdate:
          type: boolean
          description: Optional unless patch operation.
        baseLicense:
          type: string
          description: Set baseLicense only while updating license using PUT /license endpoint
        addonLicenses:
          type: array
          description: Set addonLicenses only while updating license using PUT /license endpoint
          uniqueItems: true
          items:
            type: string
        dateLicenseLastUpdated:
          type: string
          format: date-time
          description: 'The time that this role licenses were most recently updated using the PUT /license endpoint. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
        base:
          type: boolean
        default:
          type: boolean
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    RoleSettings:
      type: object
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
          readOnly: true
        backfillEnabled:
          type: boolean
          description: Boolean showing if organization is opted in or not to role backfills
        authorizationGrantDivisionAware:
          type: boolean
          description: Boolean enabling enforcement of division aware for authorization grant add and delete
          allowEmptyValue: true
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    PolicyAttributeSet:
      type: object
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
          readOnly: true
        name:
          type: string
        policyAttributes:
          type: array
          description: A set of the attributes checked by the requested policy.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PolicyAttribute'
        presetAttributes:
          type: object
          description: Map of names and values of preset attributes used in this policy.
          additionalProperties:
            $ref: '#/components/schemas/TypedAttribute'
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    ConditionalGroupRoutingRule:
      type: object
      properties:
        queue:
          description: The queue being evaluated for this rule.  If null, the current queue will be used.
          $ref: '#/components/schemas/DomainEntityRef'
        metric:
          type: string
          description: The queue metric being evaluated
          enum:
          - EstimatedWaitTime
          - ServiceLevel
        operator:
          type: string
          description: The operator that compares the actual value against the condition value
          enum:
          - GreaterThan
          - GreaterThanOrEqualTo
          - LessThan
          - LessThanOrEqualTo
        conditionValue:
          type: number
          format: double
          description: The limit value, beyond which a rule evaluates as true
        groups:
          type: array
          description: The group(s) to activate if the rule evaluates as true
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MemberGroup'
        waitSeconds:
          type: integer
          format: int32
          description: The number of seconds to wait in this rule, if it evaluates as true, before evaluating the next rule.  For the final rule, this is ignored, so need not be specified.
    AuthorizationPolicy:
      type: object
      required:
      - effect
      - subject
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
          readOnly: true
        name:
          type: string
        targetResource:
          type: string
          description: The targeted resource to which the policy should apply, in the form of domain:entity:action
          readOnly: true
        subject:
          description: The subject to whom the policy will apply, including type and id
          $ref: '#/components/schemas/Subject'
        effect:
          type: string
          description: The effect this policy should have when its conditions are met
          enum:
          - ALLOW
          - DENY
        condition:
          description: The condition tree the policy will evaluate
          $ref: '#/components/schemas/PolicyCondition'
        description:
          type: string
        dateModified:
          type: string
          format: date-time
          description: 'Date this policy was last modified. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
        presetAttributes:
          type: object
          description: Map of names and values of preset attributes to use in policy evaluation
          additionalProperties:
            $ref: '#/components/schemas/TypedAttribute'
        active:
          type: boolean
          description: Flag for active enforcement. If this value is false or null, the policy will be saved but will not be checked or enforced on users.
        applyToClients:
          type: boolean
          description: Flag to determine whether policy applies to OAuth Clients
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    Education:
      type: object
      properties:
        school:
          type: string
        fieldOfStudy:
          type: string
        notes:
          type: string
