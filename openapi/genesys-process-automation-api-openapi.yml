        - workforce.management.shift.trading
        - system
      value:
        type: integer
        format: int64
  TestModeResults:
    type: object
    properties:
      schemaValidation:
        description: Information about the validation of the schema of the event body passed in to test mode
        $ref: '#/definitions/TestSchemaOperation'
      targetValidation:
        description: Information about the validation of the trigger target
        $ref: '#/definitions/TestTargetOperation'
      jsonPathValidation:
        description: Information about the json path matching criteria
        $ref: '#/definitions/TestMatchesOperation'
      triggerMatches:
        type: boolean
        description: Whether the trigger would have matched on the provided event body
    description: Information about trigger test mode execution
  ScheduledTrigger:
    type: object
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
        description: The name of the scheduled trigger. Can be up to 162 characters in length.
      target:
        description: The target to invoke when the scheduled trigger fires
        $ref: '#/definitions/TriggerTarget'
      version:
        type: integer
        format: int64
        description: Version of this scheduled trigger
      enabled:
        type: boolean
        description: Whether or not the scheduled trigger is enabled
      schedule:
        description: The schedule configuration for when this trigger should fire
        $ref: '#/definitions/TriggerSchedule'
      description:
        type: string
        description: Description of the trigger. Can be up to 512 characters in length.
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
    description: Defines a process automation scheduled trigger.
  TestTargetOperation:
    type: object
    properties:
      name:
        type: string
        description: The name of the processing step
      step:
        type: integer
        format: int32
        description: The number of the processing step
      matches:
        type: boolean
        description: Whether or not the operation matches expectations
      details:
        type: array
        description: Details about why the operation did or did not succeed
        items:
          type: string
    description: Information about the Trigger test mode target validation step
  TopicCursorEntityListing:
    type: object
    properties:
      entities:
        type: array
        items:
          type: string
      nextUri:
        type: string
      selfUri:
        type: string
      previousUri:
        type: string
    description: Cursor listing of Topics.
  WorkflowTargetSettings:
    type: object
    properties:
      dataFormat:
        type: string
        description: The data format to use when invoking target.
        enum:
        - Json
        - TopLevelPrimitives
  TestMatchesOperation:
    type: object
    properties:
      name:
        type: string
        description: The name of the processing step
      step:
        type: integer
        format: int32
        description: The number of the processing step
      matches:
        type: boolean
        description: Whether or not the operation matches expectations
      details:
        type: array
        description: Details about why the operation did or did not succeed
        items:
          $ref: '#/definitions/MatchCriteriaTestResult'
    description: Information about the Trigger test mode processing step
  TriggerTarget:
    type: object
    properties:
      type:
        type: string
        description: The entity type to target
        enum:
        - Workflow
      id:
        type: string
        description: The ID of the entity to target
      workflowTargetSettings:
        description: Optional config for the target.
        $ref: '#/definitions/WorkflowTargetSettings'
    description: The target of a trigger invocation
  CreateScheduledTriggerRequest:
    type: object
    required:
    - enabled
    - name
    - schedule
    - target
    properties:
      target:
        description: The target to invoke when the scheduled trigger fires
        $ref: '#/definitions/TriggerTarget'
      enabled:
        type: boolean
        description: Boolean indicating if scheduled trigger is enabled
      name:
        type: string
        description: The name of the scheduled trigger. Can be up to 162 characters in length.
      schedule:
        description: The schedule configuration for when this trigger should fire
        $ref: '#/definitions/TriggerSchedule'
      description:
        type: string
        description: Description of the trigger. Can be up to 512 characters in length.
