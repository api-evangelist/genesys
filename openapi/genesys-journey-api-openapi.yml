        operator:
          type: string
          description: The comparison operator.
          enum:
          - containsAll
          - containsAny
          - notContainsAll
          - notContainsAny
          - equal
          - notEqual
          - greaterThan
          - greaterThanOrEqual
          - lessThan
          - lessThanOrEqual
          - startsWith
          - endsWith
