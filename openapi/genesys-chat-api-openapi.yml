definitions:
  AddressableEntityRef:
    type: object
    properties:
      id:
        type: string
      selfUri:
        type: string
        format: uri
  RoomUpdateRequest:
    type: object
    properties:
      description:
        type: string
        description: Room's description
      subject:
        type: string
        description: Room's subject
      pinnedMessageIds:
        type: array
        description: Room's pinned messages
        items:
          type: string
      ownerIds:
        type: array
        description: Room's owners
        items:
          type: string
  ChatMessageEntityListing:
    type: object
    properties:
      entities:
        type: array
        items:
          $ref: '#/definitions/ChatMessageResponse'
  OneOnOne:
    type: object
    properties:
      pinnedMessages:
        type: array
        description: Room's pinned messages
        items:
          $ref: '#/definitions/AddressableEntityRef'
  PinnedMessageRequest:
    type: object
    required:
    - pinnedMessageIds
    properties:
      pinnedMessageIds:
        type: array
        description: Ids of the messages to pin
        items:
          type: string
  UserReference:
    type: object
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  ChatSendMessageResponse:
    type: object
    required:
    - id
    properties:
      id:
        type: string
        description: The id of the created message
  Entity:
    type: object
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
  RoomParticipantsResponse:
    type: object
    properties:
      participants:
        type: array
        description: list of room participants
        items:
          $ref: '#/definitions/RoomParticipantResponse'
  ErrorBody:
    type: object
    properties:
      message:
        type: string
      code:
        type: string
      status:
        type: integer
        format: int32
      entityId:
        type: string
      entityName:
        type: string
      messageWithParams:
        type: string
      messageParams:
        type: object
        additionalProperties:
          type: string
      contextId:
        type: string
      details:
        type: array
        items:
          $ref: '#/definitions/Detail'
      errors:
        type: array
        items:
          $ref: '#/definitions/ErrorBody'
      limit:
        $ref: '#/definitions/Limit'
  CreateRoomResponse:
    type: object
    required:
    - jid
    properties:
      jid:
        type: string
        description: The jid of the room
  ChatReaction:
    type: object
    required:
    - emoji
    - users
    properties:
      emoji:
        type: string
        description: The emoji string for the reaction
      users:
        type: array
        description: The users that reacted with an emoji
        items:
          $ref: '#/definitions/AddressableEntityRef'
  SendMessageBody:
    type: object
    required:
    - message
    properties:
      message:
        type: string
        description: The body of the message
