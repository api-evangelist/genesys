        readOnly: true
        $ref: '#/definitions/Organization'
      authorization:
        description: Authorization for the trustee user has in this trustor organization
        readOnly: true
        $ref: '#/definitions/TrusteeAuthorization'
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  ExternalId:
    type: object
    required:
    - externalSource
    - value
    properties:
      externalSource:
        description: 'The external source of the identifier. Max: 255 characters. Leading and trailing whitespace stripped.'
        $ref: '#/definitions/ExternalSource'
      value:
        type: string
        description: 'The string value of the identifier. Max: 255 characters. Leading and trailing whitespace stripped.'
  RecordingJobEntityListing:
