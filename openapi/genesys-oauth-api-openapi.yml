        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
        description: The name of the OAuth client.
      accessTokenValiditySeconds:
        type: integer
        format: int64
        description: The number of seconds, between 5mins and 48hrs, until tokens created with this client expire. If this field is omitted, a default of 24 hours will be applied.
      description:
        type: string
      registeredRedirectUri:
        type: array
        description: 'List of allowed callbacks for this client. For example: https://myap.example.com/auth/callback'
        items:
          type: string
          format: uri
      secret:
        type: string
        description: System created secret assigned to this client. Secrets are required for code authorization and client credential grants.
      roleIds:
        type: array
        description: Deprecated. Use roleDivisions instead.
        uniqueItems: true
        items:
          type: string
      dateCreated:
        type: string
        format: date-time
        description: 'Date this client was created. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      dateModified:
        type: string
        format: date-time
        description: 'Date this client was last modified. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      createdBy:
        description: User that created this client
        $ref: '#/definitions/DomainEntityRef'
      modifiedBy:
        description: User that last modified this client
        $ref: '#/definitions/DomainEntityRef'
      authorizedGrantType:
        type: string
        description: 'The OAuth Grant/Client type supported by this client.

          Code Authorization Grant/Client type - Preferred client type where the Client ID and Secret are required to create tokens. Used where the secret can be secured.

          PKCE-Enabled Code Authorization grant type - Code grant type which requires PKCE challenge and verifier to create tokens. Used in public clients for increased security.

          Implicit grant type - Client ID only is required to create tokens. Used in browser and mobile apps where the secret can not be secured.

          SAML2-Bearer extension grant type - SAML2 assertion provider for user authentication at the token endpoint.

          Client Credential grant type - Used to created access tokens that are tied only to the client.

          '
        enum:
        - CODE
        - TOKEN
        - SAML2-BEARER
        - PASSWORD
        - CLIENT-CREDENTIALS
      scope:
        type: array
        description: The scope requested by this client. Scopes only apply to clients not using the client_credential grant
        items:
          type: string
      roleDivisions:
        type: array
        description: Set of roles and their corresponding divisions associated with this client. Roles and divisions only apply to clients using the client_credential grant
        uniqueItems: true
        items:
          $ref: '#/definitions/RoleDivision'
      state:
        type: string
        description: 'The state of the OAuth client.

          Active: The OAuth client can be used to create access tokens. This is the default state.

          Disabled: Access tokens created by the client are invalid and new ones cannot be created.

          Inactive: Access tokens cannot be created with this OAuth client and it will be deleted.'
