    type: object
    required:
    - transcriptionEngines
    properties:
      transcriptionEngines:
        type: array
        description: The transcription engine setting
        items:
          $ref: '#/definitions/ProgramTranscriptionEngine'
  TranscriptsFilters:
    type: object
    properties:
