components:
  schemas:
    OtherProfileAssignment:
      type: object
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
        currentProfile:
          description: The current performance profile that this user belongs to
          $ref: '#/components/schemas/DomainEntityRef'
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    Member:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: The user's id
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
      description: The associated user reference as a member of a performance profile
    AssignUsers:
      type: object
      required:
      - membersToAssign
      - membersToRemove
      properties:
        membersToAssign:
          type: array
          description: List of user ids to assign to a performance profile
          items:
            type: string
        membersToRemove:
          type: array
          description: List of user ids to remove from a performance profile
          items:
            type: string
    InsightsDetailsOverallItem:
      type: object
      properties:
        comparativePeriod:
          description: Insights data in the comparative period
          $ref: '#/components/schemas/InsightsDetailsOverallPeriodPoints'
        primaryPeriod:
          description: Insights data in the primary period
          $ref: '#/components/schemas/InsightsDetailsOverallPeriodPoints'
        percentOfGoalChange:
          type: number
          format: double
          description: Percent of goal change
    ProfileWithDateRange:
      type: object
      properties:
        id:
          type: string
          description: Profile ID
        name:
          type: string
        division:
          description: The division to which this entity belongs.
          $ref: '#/components/schemas/Division'
        dateStartWorkday:
          type: string
          format: date
          description: 'Start workday used as the date range. Dates are represented as an ISO-8601 string. For example: yyyy-MM-dd'
        dateEndWorkday:
          type: string
          format: date
          description: 'End workday used as the date range. Dates are represented as an ISO-8601 string. For example: yyyy-MM-dd'
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    InsightsSummaryMetricItem:
      type: object
      properties:
        metric:
          description: The gamification metric for the data
          $ref: '#/components/schemas/AddressableEntityRef'
        comparativePeriod:
          description: Insights data in the comparative period
          $ref: '#/components/schemas/InsightsSummaryMetricPeriodPoints'
        primaryPeriod:
          description: Insights data in the primary period
          $ref: '#/components/schemas/InsightsSummaryMetricPeriodPoints'
        percentOfGoalChange:
          type: number
          format: double
          description: Percent of goal change
        valueChange:
          type: number
          format: double
          description: Value change
    ContestsFinalizeRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: The Contest finalization status
          enum:
          - Completed
          - Cancelled
        winners:
          type: array
          description: The Contest finalization winners
          items:
            $ref: '#/components/schemas/ContestWinnersRequest'
        disqualifiedAgents:
          type: array
          description: The Contest finalization disqualified agents
          items:
            $ref: '#/components/schemas/ContestDisqualifiedAgents'
    ContestUserRank:
      type: object
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
        rank:
          type: integer
          format: int32
          description: The user's rank in contest, a lower rank is better (1 is the best)
        score:
          type: number
          format: double
          description: The user's contest score
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    PrizeImages:
      type: object
      properties:
        imageUrl:
          type: string
          description: The Contest Prize image url
          readOnly: true
    InsightsSummary:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/InsightsSummaryUserItem'
        pageSize:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        performanceProfile:
          description: The performance profile
          $ref: '#/components/schemas/AddressableEntityRef'
        division:
          description: The division
          $ref: '#/components/schemas/DivisionReference'
        granularity:
          type: string
          description: Granularity
          enum:
          - Daily
          - Weekly
          - Monthly
        comparativePeriod:
          description: The comparative period work day date range
          $ref: '#/components/schemas/WorkdayPeriod'
        primaryPeriod:
          description: The primary period work day date range
          $ref: '#/components/schemas/WorkdayPeriod'
        pageCount:
          type: integer
          format: int32
    AllTimePoints:
      type: object
