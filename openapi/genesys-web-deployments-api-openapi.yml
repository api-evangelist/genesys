        dateIssued:
          type: string
          format: date-time
          description: 'Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
    SupportCenterScreen:
      type: object
      required:
      - moduleSettings
      - type
      properties:
        type:
          type: string
          description: The type of the screen
          enum:
          - Home
          - Category
          - SearchResults
          - Article
        moduleSettings:
          type: array
          description: 'Module settings for the screen, valid modules for each screenType: Home: Search, Categories, TopViewedArticles; Category: Search, Categories; SearchResults: Search, Results; Article: Search, Article;'
          items:
            $ref: '#/components/schemas/SupportCenterModuleSetting'
    SupportCenterCustomMessage:
      type: object
      required:
      - defaultValue
      - type
      properties:
        defaultValue:
          type: string
          description: Default value for the message
          minLength: 0
          maxLength: 300
        type:
          type: string
          description: Type of the message
          enum:
          - Welcome
          - Fallback
    BackgroundImageSettings:
      type: object
      properties:
        url:
          type: string
          description: BackgroundImage URL for agent video settings
      description: The settings to Agent Video background image
    IdleEventTrigger:
      type: object
      required:
      - eventName
      properties:
        eventName:
          type: string
          description: Name of event triggered after period of inactivity.
        idleAfterSeconds:
          type: integer
          format: int64
          description: Number of seconds of inactivity before an event is triggered.
      description: Details about an idle event trigger
    UserAuthorization:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/DomainRole'
        unusedRoles:
          type: array
          description: A collection of the roles the user is not using
          readOnly: true
          items:
            $ref: '#/components/schemas/DomainRole'
        permissions:
          type: array
          description: A collection of the permissions granted by all assigned roles
          readOnly: true
          items:
            type: string
        permissionPolicies:
          type: array
          description: The policies configured for assigned permissions.
          readOnly: true
          items:
            $ref: '#/components/schemas/ResourcePermissionPolicy'
    MediaTypeAccess:
      type: object
      properties:
        inbound:
          type: array
          description: List of media types allowed for inbound messages from customers. If inbound messages from a customer contain media that is not in this list, the media will be dropped from the outbound message.
          items:
            $ref: '#/components/schemas/MediaType'
        outbound:
          type: array
          description: List of media types allowed for outbound messages to customers. If an outbound message is sent that contains media that is not in this list, the message will not be sent.
          items:
            $ref: '#/components/schemas/MediaType'
      description: Media type access definitions
    ResourceConditionValue:
      type: object
      properties:
        type:
          type: string
          enum:
          - SCALAR
          - VARIABLE
          - USER
          - QUEUE
          - TEAM
        value:
          type: string
    PresenceDefinition:
      type: object
      properties:
        id:
          type: string
          description: description
        systemPresence:
          type: string
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    BotMessengerProfile:
      type: object
      properties:
        name:
          type: string
          description: Name of the Bot
        avatarUrl:
          type: string
          description: Avatar for Bot
    IdentityResolutionAutomergeConfig:
      type: object
      properties:
        authenticatedWebMessaging:
          type: boolean
          description: Whether automerging is enabled for Authenticated Webmessaging conversations in this channel.
        webTracking:
          type: boolean
          description: Whether automerging is enabled for Web Tracking sessions in this channel.
    ErrorBody:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
        status:
          type: integer
          format: int32
        entityId:
          type: string
        entityName:
          type: string
        messageWithParams:
          type: string
        messageParams:
          type: object
          additionalProperties:
            type: string
        contextId:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/Detail'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorBody'
        limit:
          $ref: '#/components/schemas/Limit'
