definitions:
  LogCaptureQueryRequest:
    type: object
    required:
    - interval
    - userId
    properties:
      interval:
        type: string
        format: interval
        description: 'Date and time range to query. Intervals are represented as an ISO-8601 string. For example: YYYY-MM-DDThh:mm:ss/YYYY-MM-DDThh:mm:ss'
      userId:
        type: string
        description: Id of the user to query.
      sortOrder:
        type: string
        description: Order of results. Default order is ASC.
        enum:
        - ASC
        - DESC
  LogCaptureUserConfigurationResponse:
    type: object
    required:
    - dateExpired
    properties:
      id:
        type: string
        description: The ID of the user for which log capture is configured.
        readOnly: true
      dateStarted:
        type: string
        format: date-time
        description: 'Indicates when log capture was enabled for the user. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        readOnly: true
      dateExpired:
        type: string
        format: date-time
        description: 'Indicates when log capture will be turned off for the user. (Must be within 24 hours). Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  AddressableEntityRef:
    type: object
    properties:
      id:
        type: string
      selfUri:
        type: string
        format: uri
  ErrorBody:
    type: object
    properties:
      message:
        type: string
      code:
        type: string
      status:
        type: integer
        format: int32
      entityId:
        type: string
      entityName:
        type: string
      messageWithParams:
        type: string
      messageParams:
        type: object
        additionalProperties:
          type: string
      contextId:
        type: string
      details:
        type: array
        items:
          $ref: '#/definitions/Detail'
      errors:
        type: array
        items:
          $ref: '#/definitions/ErrorBody'
      limit:
        $ref: '#/definitions/Limit'
  LogCaptureQueryResponse:
    type: object
    properties:
      entities:
        type: array
        items:
          $ref: '#/definitions/LogEntry'
      nextUri:
        type: string
      selfUri:
        type: string
  LogCaptureUserConfiguration:
    type: object
    required:
    - dateExpired
    properties:
      id:
        type: string
        description: The ID of the user for which log capture is configured.
        readOnly: true
      dateStarted:
        type: string
        format: date-time
        description: 'Indicates when log capture was enabled for the user. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        readOnly: true
      dateExpired:
        type: string
        format: date-time
        description: 'Indicates when log capture will be turned off for the user. (Must be within 24 hours). Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      captureMethod:
        type: string
        description: Indicates the method by which the logs were captured.
        readOnly: true
        enum:
        - OnDemand
        - Scheduled
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  LogCaptureDownloadExecutionResponse:
    type: object
    required:
    - dateStart
    - fileUrl
    - id
    - state
    - user
    properties:
      id:
        type: string
        description: Id of file download job.
      user:
        description: Details of the user that created the job
        readOnly: true
        $ref: '#/definitions/AddressableEntityRef'
      state:
        type: string
        description: Execution state of the download.
        readOnly: true
        enum:
        - Running
        - Failed
        - Succeeded
      dateStart:
        type: string
        format: date-time
        description: 'Start date of file download execution. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        readOnly: true
      fileUrl:
        type: string
        description: Url of a file with query result.
        readOnly: true
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  Limit:
    type: object
    properties:
      key:
        type: string
      namespace:
        type: string
        enum:
        - web.deployments
