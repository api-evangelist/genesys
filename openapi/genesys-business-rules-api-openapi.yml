        jsonSchema:
          example: "{\n    \"appliesTo\": [\n        \"CONTACT\"\n    ],\n    \"jsonSchema\": {\n        \"title\": \"Example schema\",\n        \"description\": \"Uses all of the core types for illustrative purposes\",\n        \"properties\": {\n            \"field1_text\": {\n                \"title\": \"Field 1\",\n                \"description\": \"field1\",\n                \"allOf\": [ { \"$ref\": \"#/definitions/text\" } ],\n                \"minLength\": 0,\n                \"maxLength\": 39\n            },\n            \"field2_longtext\": {\n                \"title\": \"Field 2\",\n                \"description\": \"field2\",\n                \"allOf\": [ { \"$ref\": \"#/definitions/longtext\" } ],\n                \"minLength\": 0,\n                \"maxLength\": 1000\n            },\n            \"field3_enum\": {\n                \"title\": \"Field 3\",\n                \"description\": \"Field 3\",\n                \"allOf\": [ { \"$ref\": \"#/definitions/enum\" } ],\n                \"enum\": [\n                    \"enum1\",\n                    \"enum2\"\n                ]\n            },\n            \"field4_identifier\": {\n                \"title\": \"field4\",\n                \"description\": \"Field 4\",\n                \"allOf\": [ { \"$ref\": \"#/definitions/identifier\" } ],\n                \"minLength\": 0,\n                \"maxLength\": 37\n            },\n            \"field5_integer\": {\n                \"title\": \"field5\",\n                \"description\": \"Field 5\",\n                \"allOf\": [ { \"$ref\": \"#/definitions/integer\" } ],\n                \"minimum\": 1,\n                \"maximum\": 24\n            },\n            \"field6_number\": {\n                \"title\": \"field6\",\n                \"description\": \"Field 6\",\n                \"allOf\": [ { \"$ref\": \"#/definitions/number\" } ],\n                \"minimum\": 2.7,\n                \"maximum\": 31.3\n            },\n            \"field7_date\": {\n                \"title\": \"field7\",\n                \"description\": \"Field 7\",\n                \"allOf\": [ { \"$ref\": \"#/definitions/date\"}]\n            },\n            \"field8_datetime\": {\n                \"title\": \"field8\",\n                \"description\": \"Field 8\",\n                \"allOf\": [ { \"$ref\": \"#/definitions/datetime\"}]\n            },\n            \"field9_checkbox\": {\n                \"title\": \"field9\",\n                \"description\": \"Field 9\",\n                \"allOf\": [ { \"$ref\": \"#/definitions/checkbox\"}]\n            },\n            \"field10_tag\": {\n                \"title\": \"field10\",\n                \"description\": \"Field 10\",\n                \"allOf\": [ { \"$ref\": \"#/definitions/tag\" } ],\n                \"items\": {\n                    \"minLength\": 1,\n                    \"maxLength\": 20\n                },\n                \"minItems\": 0,\n                \"maxItems\": 10,\n                \"uniqueItems\": true\n            }\n        },\n        \"$schema\": \"http://json-schema.org/draft-04/schema#\"\n    }\n}"
          description: A JSON schema defining the extension to the built-in entity type.
          $ref: '#/components/schemas/JsonSchemaDocument'
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    DecisionTableInputColumnExpression:
      type: object
      required:
      - comparator
      - contractual
      properties:
        contractual:
          description: A value that is defined by a contract schema and used to form the left side of a logical condition.
          $ref: '#/components/schemas/Contractual'
        comparator:
          type: string
          description: A comparator used to join the left and right sides of a logical condition.
          enum:
          - Equals
          - NotEquals
          - GreaterThan
          - GreaterThanOrEquals
          - LessThan
          - LessThanOrEquals
          - StartsWith
          - NotStartsWith
          - EndsWith
          - NotEndsWith
          - Contains
          - NotContains
          - ContainsAny
          - NotContainsAny
          - ContainsAll
          - NotContainsAll
          - ContainsExactly
          - NotContainsExactly
          - ContainsSequence
          - NotContainsSequence
          - IsSubset
          - NotIsSubset
          - IsSubsequence
          - NotIsSubsequence
    PutDecisionTableRowRequest:
      type: object
      properties:
        inputs:
          type: object
          description: The full updated input values of the row. The key for this map is the column ID the row value relates. Column IDs are available from the decision table entity
          additionalProperties:
            $ref: '#/components/schemas/DecisionTableRowParameterValue'
        outputs:
          type: object
          description: The full updated output values of the row. The key for this map is the column ID the row value relates. Column IDs are available from the decision table entity
          additionalProperties:
            $ref: '#/components/schemas/DecisionTableRowParameterValue'
    UpdateDecisionTableRequest:
      type: object
      properties:
        name:
          type: string
          description: The decision table name.
        description:
          type: string
          description: The decision table description.
        columns:
          description: The column definitions for this decision table.
          $ref: '#/components/schemas/UpdateDecisionTableColumnsRequest'
    CreateDecisionTableRequest:
      type: object
      required:
      - columns
      - divisionId
      - name
      - schemaId
      properties:
        name:
          type: string
          description: The decision table name.
        description:
          type: string
          description: The decision table description.
        divisionId:
          type: string
          description: The ID of the division the decision table belongs to.
        schemaId:
          type: string
          description: The ID of the rules schema used by the decision table.
        columns:
          description: The column definitions for this decision table.
          $ref: '#/components/schemas/CreateDecisionTableColumnsRequest'
    DecisionTableExecutionRequest:
      type: object
      required:
      - inputs
      properties:
        inputs:
          type: object
          example: "{\n    \"inputs\": {\n        \"string_attribute\": \"value\",\n        \"integer_attribute\": 1234,\n        \"number_attribute\": 1234.567,\n        \"boolean_attribute\": true,\n        \"enum_attribute\": \"enum_option_key\",\n        \"date_attribute\": \"2024-12-01\",\n        \"date_time_attribute\": \"2024-12-01T00:00:00.000Z\",\n        \"queue_attribute\": {\n            \"queue\": {\n                \"id\": \"4340dbda-acba-4bbb-a861-7016da22cbf6\"\n            }\n        }\n    }\n}"
          description: The JSON input data for executing the decision table. Must be valid according to the execution input contract defined on the table. In the case of enum decision table columns the enum options key should be provided as the value, not the enum options label as this can be changed. For business rules queue columns both “queue” and “id” keys will be required regardless of the queue attribute key and these do not change.
          additionalProperties:
            type: object
    DecisionTableListing:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/DecisionTable'
        nextUri:
          type: string
        selfUri:
          type: string
        previousUri:
          type: string
    DecisionTableExportJobRequest:
      type: object
      required:
      - exportType
      - format
      properties:
        tableVersion:
          type: integer
          format: int32
        exportType:
          type: string
          description: The type of export to perform.
          enum:
          - Template
          - Populated
        format:
          type: string
          description: The format of the exported file.
          enum:
          - Csv
    DecisionTable:
      type: object
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
          readOnly: true
        name:
          type: string
        division:
          description: The division to which this entity belongs.
          $ref: '#/components/schemas/Division'
        description:
          type: string
          description: The decision table description.
        dateCreated:
          type: string
          format: date-time
          description: 'UTC date time indicating when this decision table was created. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
        dateModified:
          type: string
          format: date-time
          description: 'UTC date time indicating when this decision table was last updated. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
        datePublished:
          type: string
          format: date-time
          description: 'UTC date time indicating when this decision table was published. Null if never published. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
        published:
          description: The entity reference to the most recently published decision table version. Null if never published.
          readOnly: true
          $ref: '#/components/schemas/DecisionTableVersionEntity'
        latest:
          description: The entity reference to the most recently created decision table version.
          readOnly: true
          $ref: '#/components/schemas/DecisionTableVersionEntity'
        latestVersionStatus:
          type: string
          description: The status of the most recently created decision table version. Lets clients distinguish e.g. a Draft latest version from a Superseded one without an extra request.
          readOnly: true
          enum:
          - Draft
          - Published
          - Error
          - Preparing
          - Superseded
        columns:
          description: The column definitions of this decision table.
          $ref: '#/components/schemas/DecisionTableColumns'
        publishedContract:
          description: The published contract information for this decision table.
          $ref: '#/components/schemas/DecisionTableContract'
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    DecisionTableColumnDefaultRowValue:
      type: object
      properties:
        value:
          type: string
          description: A default string value for this column, will be cast to appropriate type according to the relevant contract schema property.
        values:
          type: array
          description: A default list of values for this column, items will be cast to appropriate type according to the relevant contract schema property
          items:
            type: string
        special:
          type: string
          description: A default special value enum for this column.
          enum:
          - Wildcard
          - 'Null'
          - Empty
          - CurrentTime
      description: Must provide a valid value for exactly one of the fields in this class.
    DecisionTableRowParameterValue:
      type: object
      properties:
        literal:
          description: A literal parameter value
          $ref: '#/components/schemas/Literal'
    CreateDecisionTableRowRequest:
      type: object
      required:
      - inputs
      - outputs
      properties:
        rowIndex:
          type: integer
          format: int32
          description: 'The absolute position of this row in the decision table. Must be an integerstarting from 1, must be positive and less than or equal to the size of the table. If not provided row will be append to the end of the table. '
        inputs:
          type: object
          description: The input values of the row. The key for this map is the column ID the row value relates. Column IDs are available from the decision table entity
          additionalProperties:
            $ref: '#/components/schemas/DecisionTableRowParameterValue'
        outputs:
          type: object
          description: The output values of the row. The key for this map is the column ID the row value relates. Column IDs are available from the decision table entity
          additionalProperties:
            $ref: '#/components/schemas/DecisionTableRowParameterValue'
    DecisionTableOutputColumn:
      type: object
      required:
      - value
      properties:
        id:
          type: string
          description: The id of the column.
          readOnly: true
        defaultsTo:
          description: The default row value for this column that will be used for an output value where no value  is provided by a row.
          $ref: '#/components/schemas/DecisionTableColumnDefaultRowValue'
        value:
          description: The output data of this column that will be provided by each row.
          $ref: '#/components/schemas/OutputValue'
    Schema:
      type: object
      properties:
        title:
          type: string
          description: A core type's title
          readOnly: true
        description:
          type: string
          description: A core type's description
          readOnly: true
        type:
          type: array
          example: '["string"] for a text-based core type, ["integer"] for a numeric core type, or ["boolean", "null"] for the checkbox core type'
          description: An array of fundamental JSON Schema primitive types on which the core type is based
          readOnly: true
          items:
            type: string
        items:
          example: '{

            type": "string",

            "pattern": "^[\\S]+$"

            }'
          description: Denotes the type and pattern of the items in an enum core type
          readOnly: true
          $ref: '#/components/schemas/Items'
        pattern:
          type: string
          description: For the "date" and "datetime" core types, denotes the regex prescribing the allowable date/datetime format
          readOnly: true
    DecisionTableVersion:
      type: object
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
          readOnly: true
        name:
          type: string
        division:
          description: The division to which this entity belongs.
          $ref: '#/components/schemas/Division'
        version:
          type: integer
          format: int32
          description: The decision table version.
        status:
          type: string
          description: Current status of this decision table version
          enum:
          - Draft
          - Published
          - Error
          - Preparing
          - Superseded
        description:
          type: string
          description: The decision table description.
        rowCount:
          type: integer
          format: int32
          description: The number of rows in this decision table version.
        rowsUri:
          type: string
          description: The rows URI for this decision table version.
        dateCreated:
          type: string
          format: date-time
          description: 'UTC date time indicating when this decision table version was created. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
        dateModified:
          type: string
          format: date-time
          description: 'UTC date time indicating when this decision table version was last updated. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
        datePublished:
          type: string
          format: date-time
          description: 'UTC date time indicating when this decision table version was published. Null if never published. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
        columns:
          description: The column definitions of this decision table version.
          $ref: '#/components/schemas/DecisionTableColumns'
        contract:
          description: The contract information for this decision table version.
          $ref: '#/components/schemas/DecisionTableContract'
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    RowSearchPredicate:
      type: object
      required:
      - columnId
      - operator
      properties:
        columnId:
          type: string
          description: The decision table column identifier this predicate applies to
        operator:
          type: string
          description: The search operator for this predicate
          enum:
          - Equals
          - StartsWith
          - GreaterThan
          - GreaterThanOrEquals
          - LessThan
          - LessThanOrEquals
          - ContainsItem
        value:
          type: string
          description: The value that will be searched for in rows. Exactly one of 'value' or 'special' can be used.
          minLength: 1
          maxLength: 200
        special:
          type: string
          description: The special value that will be searched for in rows. Exactly one of 'value' or 'special' can be used.
          enum:
          - Wildcard
          - 'Null'
          - Empty
          - CurrentTime
    DecisionTableJobValidationError:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
        status:
          type: integer
          format: int32
        entityId:
          type: string
        entityName:
          type: string
        messageWithParams:
          type: string
        messageParams:
          type: object
          additionalProperties:
            type: string
        contextId:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/Detail'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorBody'
        limit:
