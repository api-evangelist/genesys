            - integrationPresence
            - conversationSummary
            - outOfOffice
            - geolocation
            - station
            - authorization
            - lasttokenissued
            - authorization.unusedRoles
            - team
            - workPlanBidRanks
            - externalContactsSettings
            - groups
            - customAttributes
            - profileSkills
            - certifications
            - locations
            - skills
            - languages
            - languagePreference
            - employerInfo
            - biography
            - dateLastLogin
            - dateWelcomeSent
            - callerUser.routingStatus
            - callerUser.primaryPresence
            - callerUser.conversationSummary
            - callerUser.outOfOffice
            - callerUser.geolocation
            - conversations
            - transcription
