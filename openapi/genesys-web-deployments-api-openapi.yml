components:
  schemas:
    Contact:
      type: object
      properties:
        address:
          type: string
          description: Email address or phone number for this contact type
        display:
          type: string
          description: Formatted version of the address property
          readOnly: true
        mediaType:
          type: string
          enum:
          - PHONE
          - EMAIL
          - SMS
        type:
          type: string
          enum:
          - PRIMARY
          - WORK
          - WORK2
          - WORK3
          - WORK4
          - HOME
          - MOBILE
          - MAIN
          - OTHER
        extension:
          type: string
          description: Use internal extension instead of address. Mutually exclusive with the address field.
        countryCode:
          type: string
        integration:
          type: string
          example: microsoftteams
          description: Integration tag value if this number is associated with an external integration.
    Image:
      type: object
      properties:
        resolution:
          type: string
          description: 'Height and/or width of image. ex: 640x480 or x128'
        imageUri:
          type: string
    SupportCenterDetailedCategoryModuleSidebar:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: Whether sidebar is enabled or not
    SupportCenterImage:
      type: object
      required:
      - source
      properties:
        source:
          description: Source URLs for image
          $ref: '#/components/schemas/SupportCenterImageSource'
    ConversationClearSettings:
      type: object
      properties:
        enabled:
          type: boolean
          description: whether or not conversation clear setting is enabled
    MediaTypes:
      type: object
      properties:
        allow:
          description: Specify allowed media types for inbound and outbound messages. If this field is empty, all inbound and outbound media will be blocked.
          $ref: '#/components/schemas/MediaTypeAccess'
      description: Media types
    WebDeploymentFlowEntityRef:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: The Flow ID
        name:
          type: string
          description: The Flow name
        selfUri:
          type: string
          format: uri
        flowDescription:
          type: string
          description: The flow description for the webdeployment
        publishVersion:
          description: The published config version for the associated deployment
          $ref: '#/components/schemas/FlowVersion'
    MessengerSettings:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether or not messenger is enabled
        styles:
          description: The style settings for messenger
          $ref: '#/components/schemas/MessengerStyles'
        launcherButton:
          description: The launcher button settings for messenger
          $ref: '#/components/schemas/LauncherButtonSettings'
        fileUpload:
          description: The file upload settings for messenger
          $ref: '#/components/schemas/FileUploadSettings'
        apps:
          description: The apps embedded in the messenger
          $ref: '#/components/schemas/MessengerApps'
        homeScreen:
          description: The homescreen settings for messenger
          $ref: '#/components/schemas/MessengerHomeScreen'
        sessionPersistenceType:
          type: string
          description: The session persistence type for messenger
          enum:
          - AcrossSubdomains
          - DomainOrSubdomainOnly
      description: Settings concerning messenger
    Education:
      type: object
      properties:
        school:
          type: string
        fieldOfStudy:
          type: string
        notes:
          type: string
          description: Notes about education has a 2000 character limit
        dateStart:
          type: string
          format: date
          description: 'Dates are represented as an ISO-8601 string. For example: yyyy-MM-dd'
        dateEnd:
          type: string
          format: date
          description: 'Dates are represented as an ISO-8601 string. For example: yyyy-MM-dd'
    LauncherButtonSettings:
      type: object
      properties:
        visibility:
          type: string
          description: The visibility settings for the button
          enum:
          - 'On'
          - 'Off'
          - OnDemand
        displayType:
          type: string
          description: The display type of the launcher button
          enum:
          - IconAndText
          - Icon
          - Text
        icon:
          description: The icon for the launcher button
          $ref: '#/components/schemas/Icon'
      description: The settings for the launcher button
    AgentVideoSettings:
      type: object
      properties:
        allowCamera:
          type: boolean
          description: whether or not agent camera is allowed
        allowScreenShare:
          type: boolean
          description: whether or not agent screen share is allowed
        allowMicrophone:
          type: boolean
          description: whether or not agent microphone is allowed
        background:
          type: string
          description: background for agent
          enum:
          - BLUR
          - NONE
          - IMAGE
        backgroundImage:
          description: background image settings for agent
          $ref: '#/components/schemas/BackgroundImageSettings'
      description: The settings for Agent Video
    WebDeploymentsOAuthExchangeRequest:
      type: object
      required:
      - deploymentId
      properties:
        deploymentId:
          type: string
          description: The WebDeployment ID
        journeyContext:
          description: A Customer journey context.
          $ref: '#/components/schemas/WebDeploymentsJourneyContext'
        oauth:
          $ref: '#/components/schemas/WebDeploymentsOAuthRequestParameters'
    MessengerStyles:
      type: object
      properties:
        primaryColor:
          type: string
          example: '#a7017c'
          description: The primary color of messenger in hexadecimal
    CustomI18nLabels:
      type: object
      properties:
        language:
          type: string
          description: Language of localized labels in homescreen app (eg. en-us, de-de) and push notification
        localizedLabels:
          type: array
          description: Contains localized labels used in messenger apps and push notification. PushNotificationTitle and PushNotificationBody are required when notifications are enabled.
