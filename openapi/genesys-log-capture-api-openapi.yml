      value:
        type: integer
        format: int64
  LogCaptureUserConfigurationListing:
    type: object
    properties:
      total:
        type: integer
        format: int64
      entities:
        type: array
        items:
          $ref: '#/definitions/LogCaptureUserConfiguration'
      selfUri:
        type: string
        format: uri
    description: List of log capture user configurations including total count and entities
  LogEntry:
    type: object
    properties:
      level:
        type: string
        description: Level of log entry
      message:
        type: string
        description: Log message
      timestamp:
        type: integer
