definitions:
  MatchTestResult:
    type: object
    properties:
      value:
        description: The value of the field being matched
        $ref: '#/definitions/JsonNode'
      path:
        type: string
        description: 'The json path to the json node being matched on. ex: $[''things''][1]'
    description: Information about the results being matched by the expressions
  UpdateScheduledTriggerRequest:
    type: object
    required:
    - enabled
    - name
    - schedule
    - target
    - version
    properties:
      version:
        type: integer
        format: int64
        description: Version of this scheduled trigger
      enabled:
        type: boolean
        description: Boolean indicating if scheduled trigger is enabled
      target:
        description: The target to invoke when the scheduled trigger fires
        $ref: '#/definitions/TriggerTarget'
      name:
        type: string
        description: The name of the scheduled trigger. Can be up to 162 characters in length.
      schedule:
        description: The schedule configuration for when this trigger should fire
        $ref: '#/definitions/TriggerSchedule'
      description:
        type: string
        description: Description of the trigger. Can be up to 512 characters in length.
  UpdateTriggerRequest:
    type: object
    required:
    - enabled
    - name
    - target
    - topicName
    - version
    properties:
      version:
        type: integer
        format: int64
        description: Version of this trigger
      enabled:
        type: boolean
        description: Boolean indicating if Trigger is enabled
      target:
        description: The target to invoke when a matching event is received
        $ref: '#/definitions/TriggerTarget'
      matchCriteria:
        type: array
        description: The configuration for when a trigger is considered to be a match for an event
        items:
          $ref: '#/definitions/MatchCriteria'
      name:
        type: string
        description: The name of the trigger
      topicName:
        type: string
        description: The topic that will cause the trigger to be invoked. Must match existing trigger topicName.
      eventTTLSeconds:
        type: integer
        format: int32
        description: Optional length of time that events are meaningful after origination. Events older than this threshold may be dropped if the platform is delayed in processing events. Unset means events are valid indefinitely, otherwise must be set to at least 10 seconds. Only one of eventTTLSeconds or delayBySeconds can be set.
      delayBySeconds:
        type: integer
        format: int32
        description: Optional delay invoking target after trigger fires. Must be in the range of 60 to 900 seconds. Only one of eventTTLSeconds or delayBySeconds can be set.
      description:
        type: string
        description: Description of the trigger. Can be up to 512 characters in length.
  CreateTriggerRequest:
    type: object
    required:
    - enabled
    - name
    - target
    - topicName
    properties:
      target:
        description: The target to invoke when a matching event is received
        $ref: '#/definitions/TriggerTarget'
      enabled:
        type: boolean
        description: Boolean indicating if Trigger is enabled
      matchCriteria:
        type: array
        description: The configuration for when a trigger is considered to be a match for an event. When not provided, all events will fire the trigger
        items:
          $ref: '#/definitions/MatchCriteria'
      name:
        type: string
        description: The name of the trigger
      topicName:
        type: string
        description: 'The topic that will cause the trigger to be invoked. Cannot be updated after creation. Valid topics can be found at /processautomation/triggers/topics '
      eventTTLSeconds:
        type: integer
        format: int32
        description: Optional length of time that events are meaningful after origination. Events older than this threshold may be dropped if the platform is delayed in processing events. Unset means events are valid indefinitely, otherwise must be set to at least 10 seconds. Only one of eventTTLSeconds or delayBySeconds can be set.
      delayBySeconds:
        type: integer
        format: int32
        description: Optional delay invoking target after trigger fires. Must be in the range of 60 to 900 seconds. Only one of eventTTLSeconds or delayBySeconds can be set.
      description:
        type: string
        description: Description of the trigger. Can be up to 512 characters in length.
  TriggerSchedule:
    type: object
    properties:
      minutes:
        type: string
        description: Minutes on which the trigger should fire. Coma separated list of up to 2 values 0-59
      hours:
        type: string
        description: Hours on which the trigger should fire. 0-23 or '*' for every hour.
      daysOfMonth:
        type: string
        description: Days of month on which the trigger should fire. 1-31 or '*' for every or '?' for any
      months:
        type: string
        description: Months on which the trigger should fire. 1-12 or '*' for every
      daysOfWeek:
        type: string
        description: Days of week on which the trigger should fire. 1-7 or '*' for every or '?' for any
      timezone:
        type: string
        description: Timezone for the trigger schedule
    description: Schedule configuration for a scheduled trigger
  TriggerEntityListing:
    type: object
    properties:
      entities:
        type: array
        items:
          $ref: '#/definitions/Trigger'
      nextUri:
        type: string
      selfUri:
        type: string
      previousUri:
        type: string
  TestMatchesEventOperation:
    type: object
    properties:
      name:
        type: string
        description: The name of the processing step
      step:
        type: integer
        format: int32
        description: The number of the processing step
      matchedTriggers:
        type: array
        description: Triggers that matched
        items:
          $ref: '#/definitions/TestModeTrigger'
      unmatchedTriggers:
        type: array
        description: Triggers that did not match
        items:
          $ref: '#/definitions/TestModeTrigger'
    description: Results from evaluating matching criteria against test input
  TestSchemaOperation:
    type: object
    properties:
      name:
        type: string
        description: The name of the processing step
      step:
        type: integer
        format: int32
        description: The number of the processing step
      matches:
        type: boolean
        description: Whether or not the operation matches expectations
      details:
        type: array
        description: Details about why the operation did or did not succeed
        items:
          type: string
    description: Information about the Trigger test mode schema validation step
  MatchCriteriaTestResult:
    type: object
    properties:
      jsonPath:
        type: string
        description: The Goessner json path of the field to match
      operator:
        type: string
        description: The type of operation to perform for matching check
        enum:
        - GreaterThanOrEqual
        - LessThanOrEqual
        - Equal
        - NotEqual
        - LessThan
        - GreaterThan
        - NotIn
        - In
        - Contains
        - All
        - Exists
        - Size
      value:
        description: The value to match on. Only one of value and values can be included
        $ref: '#/definitions/JsonNode'
      values:
        type: array
        description: The list of values to match on. Only one of value and values can be included
        items:
          $ref: '#/definitions/JsonNode'
      generatedJsonPathCondition:
        type: string
        description: The generated json path condition
      match:
        type: boolean
        description: Did the generated json path condition match
      jsonPathExtraction:
        type: array
        description: The json paths and their values that were compared
        items:
          $ref: '#/definitions/MatchTestResult'
    description: Results of a matching expression
  ErrorBody:
    type: object
    properties:
      message:
        type: string
      code:
        type: string
      status:
        type: integer
        format: int32
      entityId:
        type: string
      entityName:
        type: string
      messageWithParams:
        type: string
      messageParams:
        type: object
        additionalProperties:
          type: string
      contextId:
        type: string
      details:
        type: array
        items:
          $ref: '#/definitions/Detail'
      errors:
        type: array
        items:
          $ref: '#/definitions/ErrorBody'
      limit:
        $ref: '#/definitions/Limit'
  Detail:
    type: object
    properties:
      errorCode:
        type: string
      fieldName:
        type: string
      entityId:
        type: string
      entityName:
        type: string
  Trigger:
    type: object
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
        description: The name of the trigger
      topicName:
        type: string
        description: The topic that will cause the trigger to be invoked
      target:
        description: The target to invoke when a matching event is received
        $ref: '#/definitions/TriggerTarget'
      version:
        type: integer
        format: int64
        description: Version of this trigger
      enabled:
        type: boolean
        description: Whether or not the trigger is enabled
      matchCriteria:
        type: array
        description: The configuration for when a trigger is considered to be a match for an event
        items:
          $ref: '#/definitions/MatchCriteria'
      eventTTLSeconds:
        type: integer
        format: int32
        description: Optional length of time that events are meaningful after origination. Events older than this threshold may be dropped if the platform is delayed in processing events. Unset means events are valid indefinitely, otherwise must be set to at least 10 seconds. Only one of eventTTLSeconds or delayBySeconds can be set.
      delayBySeconds:
        type: integer
        format: int32
        description: Optional delay invoking target after trigger fires. Must be in the range of 60 to 900 seconds. Only one of eventTTLSeconds or delayBySeconds can be set.
      description:
        type: string
        description: Description of the trigger. Can be up to 512 characters in length.
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
    description: Defines a process automation trigger.
  JsonNode:
    type: object
  MatchCriteria:
    type: object
    properties:
      jsonPath:
        type: string
        description: The Goessner json path of the field to match
      operator:
        type: string
        description: The type of operation to perform for matching check
        enum:
        - GreaterThanOrEqual
        - LessThanOrEqual
        - Equal
        - NotEqual
        - LessThan
        - GreaterThan
        - NotIn
        - In
        - Contains
        - All
        - Exists
        - Size
      value:
        description: The value to match on. Only one of value and values can be included
        $ref: '#/definitions/JsonNode'
      values:
        type: array
        description: The list of values to match on. Only one of value and values can be included
        items:
          $ref: '#/definitions/JsonNode'
    description: Defines a simple matching condition
  TestModeEventResults:
    type: object
    properties:
      schemaValidation:
        description: Information about the validation of the schema of the event body passed in to test mode
        $ref: '#/definitions/TestSchemaOperation'
      triggerMatchValidation:
        description: Information about matched and unmatched triggers
        $ref: '#/definitions/TestMatchesEventOperation'
    description: Information about event test mode execution
  ScheduledTriggerEntityListing:
    type: object
    properties:
      entities:
        type: array
        items:
          $ref: '#/definitions/ScheduledTrigger'
      nextUri:
        type: string
      selfUri:
        type: string
      previousUri:
        type: string
  TestModeTrigger:
    type: object
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
        description: The name of the trigger
      enabled:
        type: boolean
        description: Whether or not the trigger is enabled
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
    description: Basic identifying information about a trigger
  Limit:
