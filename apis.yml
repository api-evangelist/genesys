aid: genesys
name: Genesys
description: >-
  Genesys is a global cloud customer experience (CX) and contact center software
  company whose flagship Genesys Cloud CX platform powers omnichannel customer
  engagement, routing, workforce management, and AI-driven orchestration. The
  Genesys Cloud Platform API is a large REST API of more than 3,000 public
  operations spanning conversations, routing, analytics, telephony (edge),
  workforce management, knowledge, journey, outbound, quality, gamification,
  integrations, and administration. It is secured with OAuth 2, described by a
  public OpenAPI (Swagger 2.0) definition, and supported by official SDKs for
  Java, .NET, Python, Go, JavaScript/Node, and iOS/Swift, a command-line
  interface, a notifications/websocket event surface, and a weekly changelog.
