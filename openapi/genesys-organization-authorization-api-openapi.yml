definitions:
  Team:
    type: object
    required:
    - name
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
        description: The team name
      division:
        description: The division to which this entity belongs.
        $ref: '#/definitions/WritableDivision'
      description:
        type: string
        description: Team information.
      dateCreated:
        type: string
        format: date-time
        description: 'Last modified datetime. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        readOnly: true
      dateModified:
        type: string
        format: date-time
        description: 'Last modified datetime. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        readOnly: true
      memberCount:
        type: integer
        format: int64
        description: Number of members in a team
        readOnly: true
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  Organization:
    type: object
    required:
    - version
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
      defaultLanguage:
        type: string
        description: 'The default language for this organization. Example: ''en'''
      defaultCountryCode:
        type: string
        description: 'The default country code for this organization. Example: ''US'''
      thirdPartyOrgName:
        type: string
        description: The short name for the organization. This field is globally unique and cannot be changed.
        readOnly: true
      thirdPartyURI:
        type: string
        format: uri
      domain:
        type: string
      features:
        type: object
        description: The state of features available for the organization.
        readOnly: true
        additionalProperties:
          type: boolean
      version:
        type: integer
        format: int32
        description: The current version of the organization.
      state:
        type: string
        description: The current state. Examples are active, inactive, deleted.
        enum:
        - active
        - inactive
        - deleted
      defaultSiteId:
        type: string
      supportURI:
        type: string
        description: Email address where support tickets are sent to.
      voicemailEnabled:
        type: boolean
      productPlatform:
        type: string
        description: Organizations Originating Platform.
        readOnly: true
        enum:
        - GenesysCloud
        - PureCloud
        - PureEngage
        - PureEngageCloud
        - PureConnect
        - PureConnectCloud
        - Unknown
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  UserConversationSummary:
    type: object
    properties:
      userId:
        type: string
      call:
        $ref: '#/definitions/MediaSummary'
      callback:
        $ref: '#/definitions/MediaSummary'
      email:
        $ref: '#/definitions/MediaSummary'
      message:
        $ref: '#/definitions/MediaSummary'
      chat:
        $ref: '#/definitions/MediaSummary'
      socialExpression:
        $ref: '#/definitions/MediaSummary'
      video:
        $ref: '#/definitions/MediaSummary'
  WorkPlanBidRanks:
