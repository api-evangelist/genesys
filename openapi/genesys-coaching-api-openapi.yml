  /api/v2/coaching/appointments:
    get:
      tags:
      - Coaching
      summary: Get appointments for users and optional date range
      description: ''
      operationId: getCoachingAppointments
      parameters:
      - name: userIds
        in: query
        description: The user IDs for which to retrieve appointments
        required: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: interval
        in: query
        description: 'Interval to filter data by. End date is not inclusive. Intervals are represented as an ISO-8601 string. For example: YYYY-MM-DDThh:mm:ss/YYYY-MM-DDThh:mm:ss'
        required: false
        schema:
          type: string
          format: interval
      - name: pageNumber
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Page size
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      - name: statuses
        in: query
        description: Appointment Statuses to filter by
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - Scheduled
            - InProgress
            - Completed
            - InvalidSchedule
      - name: facilitatorIds
        in: query
        description: The facilitator IDs for which to retrieve appointments
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: sortOrder
        in: query
        description: Sort (by due date) either Asc or Desc
        required: false
        schema:
          type: string
          enum:
          - Desc
          - Asc
      - name: relationships
        in: query
        description: Relationships to filter by
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - Creator
            - Facilitator
            - Attendee
      - name: completionInterval
        in: query
        description: 'Appointment completion start and end to filter by. End date is not inclusive. Intervals are represented as an ISO-8601 string. For example: YYYY-MM-DDThh:mm:ss/YYYY-MM-DDThh:mm:ss'
        required: false
        schema:
          type: string
          format: interval
      - name: overdue
        in: query
        description: Overdue status to filter by
        required: false
        schema:
          type: string
          enum:
          - 'True'
          - 'False'
          - Any
      - name: intervalCondition
        in: query
        description: Filter condition for interval
        required: false
        schema:
          type: string
          enum:
