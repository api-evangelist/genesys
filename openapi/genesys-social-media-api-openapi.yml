    SocialMediaQueryPredicate:
      type: object
      properties:
        type:
          type: string
          description: Optional type, can usually be inferred
          enum:
          - dimension
          - property
          - metric
        dimension:
          type: string
          description: Left hand side for dimension predicates
          enum:
          - country
          - language
          - platform
          - topic
