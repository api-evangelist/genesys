overlay: 1.0.0
info:
  title: API Evangelist enhancements for Genesys Cloud Platform API
  version: 1.0.0
extends: openapi/genesys-platform-api-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-19'
    x-apievangelist-provider: genesys
    x-authorization-server: https://login.mypurecloud.com
    x-scopes-doc: https://developer.genesys.cloud/authorization/scopes/
    x-rate-limit-doc: https://developer.genesys.cloud/platform/api/rate-limits
    x-changelog: https://developer.genesys.cloud/changelog/
    x-status-page: https://status.mypurecloud.com/
    x-notifications: https://developer.genesys.cloud/notificationsalerts/notifications/
- target: $
  update:
    x-apievangelist-artifacts:
      authentication: authentication/genesys-authentication.yml
      scopes: scopes/genesys-scopes.yml
      conventions: conventions/genesys-conventions.yml
      errors: errors/genesys-problem-types.yml
      data_model: data-model/genesys-data-model.yml
      agentic_access: agentic-access/genesys-agentic-access.yml
