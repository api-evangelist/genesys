        readOnly: true
        enum:
        - InProgress
        - Uploaded
        - Failed
      errorCode:
        type: string
        description: Error code. Used for localization
        readOnly: true
      errorMessage:
        type: string
        description: 'Error message that explains upload failure status '
        readOnly: true
  MessageFooter:
    type: object
    properties:
      type:
