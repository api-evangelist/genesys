        description: The URI for this object
        readOnly: true
  WhatsAppId:
    type: object
    required:
    - phoneNumber
    properties:
      phoneNumber:
        description: The phone number associated with this WhatsApp account. Requires 'E164 without a leading plus' phone number.
        $ref: '#/definitions/PhoneNumber'
      displayName:
        type: string
        description: 'The displayName of this person''s account in WhatsApp. Max: 100 characters.'
    description: User information for a WhatsApp account
  SegmentDetailQueryClause:
    type: object
    required:
    - predicates
    - type
    properties:
      type:
        type: string
        description: Boolean operation to apply to the provided predicates
        enum:
        - and
        - or
      predicates:
        type: array
        description: 'Like a three-word sentence: (attribute-name) (operator) (target-value).'
        items:
          $ref: '#/definitions/SegmentDetailQueryPredicate'
  ConversationDetailQueryPredicate:
    type: object
    properties:
      type:
        type: string
        description: Optional type, can usually be inferred
        enum:
        - dimension
        - property
        - metric
      dimension:
        type: string
