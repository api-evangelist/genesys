definitions:
  ErrorBody:
    type: object
    properties:
      message:
        type: string
      code:
        type: string
      status:
        type: integer
        format: int32
      entityId:
        type: string
      entityName:
        type: string
      messageWithParams:
        type: string
      messageParams:
        type: object
        additionalProperties:
          type: string
      contextId:
        type: string
      details:
        type: array
        items:
          $ref: '#/definitions/Detail'
      errors:
        type: array
        items:
          $ref: '#/definitions/ErrorBody'
      limit:
        $ref: '#/definitions/Limit'
  DomainEntityRef:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      selfUri:
        type: string
        format: uri
  Station:
    type: object
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
      description:
        type: string
      status:
        type: string
        enum:
        - AVAILABLE
        - ASSOCIATED
      userId:
        type: string
        description: The Id of the user currently logged in and associated with the station.
      webRtcUserId:
        type: string
        description: The Id of the user configured for the station if it is of type inin_webrtc_softphone. Empty if station type is not inin_webrtc_softphone.
      primaryEdge:
        $ref: '#/definitions/DomainEntityRef'
      secondaryEdge:
        $ref: '#/definitions/DomainEntityRef'
      type:
        type: string
      lineAppearanceId:
        type: string
      webRtcMediaDscp:
        type: integer
        format: int32
        description: The default or configured value of media dscp for the station. Empty if station type is not inin_webrtc_softphone.
        readOnly: true
      webRtcPersistentEnabled:
        type: boolean
        description: The default or configured value of persistent connection setting for the station. Empty if station type is not inin_webrtc_softphone.
        readOnly: true
      webRtcForceTurn:
        type: boolean
        description: Whether the station is configured to require TURN for routing WebRTC calls. Empty if station type is not inin_webrtc_softphone.
        readOnly: true
      webRtcCallAppearances:
        type: integer
        format: int32
        description: The number of call appearances on the station.
        readOnly: true
      webRtcRequireMediaHelper:
        type: boolean
        description: True when the media helper required.
        readOnly: true
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  Limit:
    type: object
    properties:
      key:
        type: string
      namespace:
        type: string
        enum:
        - web.deployments
        - web.messaging
        - agent.assistant
        - agentic.virtual.agents
        - analytics.agents
        - analytics.alerting
        - analytics.data.extraction
        - analytics
        - analytics.realtime
        - analytics.reporting.settings
        - anomaly.detection
        - architect
        - audiohook
        - audiohook.monitor
        - audit
