components:
  schemas:
    StageplanReference:
      type: object
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
          readOnly: true
        name:
          type: string
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    CaseplanDataSchemaListing:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/CaseplanDataSchema'
    StageplanListing:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Stageplan'
        nextUri:
          type: string
        selfUri:
          type: string
        previousUri:
          type: string
    StageReference:
      type: object
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
          readOnly: true
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    CasePriorityUpdate:
      type: object
      required:
      - priority
      properties:
        priority:
          type: string
          description: The priority of the Case.
          enum:
          - Unknown
          - Urgent
          - High
          - Medium
          - Low
    CustomerIntentReference:
      type: object
      properties:
        id:
          type: string
          description: The ID of the customer intent.
        name:
          type: string
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    CaseplanReference:
      type: object
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
          readOnly: true
        name:
          type: string
        version:
          type: integer
          format: int32
          description: The version of the Caseplan.
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    Caseplan:
      type: object
      required:
      - customerIntent
      - dateCreated
      - dateModified
      - defaultDueDurationInSeconds
      - defaultTtlSeconds
      - division
      - latest
      - modifiedBy
      - name
      - referencePrefix
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
          readOnly: true
        name:
          type: string
          description: The name of the Caseplan.
        division:
          description: The division to which this Caseplan belongs.
          $ref: '#/components/schemas/StarrableDivision'
        description:
          type: string
          description: The description of the Caseplan.
        referencePrefix:
          type: string
          description: The prefix used when creating the reference for Cases from the Caseplan.
        defaultDueDurationInSeconds:
          type: integer
          format: int32
          description: The default due duration in seconds for Cases created from the Caseplan.
        defaultTtlSeconds:
          type: integer
          format: int32
          description: The default TTL in seconds for Cases created from the Caseplan.
        defaultCaseOwner:
          description: The default Case owner for Cases created from the Caseplan.
          $ref: '#/components/schemas/UserReference'
        latest:
          type: integer
          format: int32
          description: The latest version of the Caseplan.
        published:
          type: integer
          format: int32
          description: The published version of the Caseplan.
        dateCreated:
          type: string
          format: date-time
          description: 'The Caseplan creation date. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        dateModified:
          type: string
          format: date-time
          description: 'The Caseplan modification date. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        datePublished:
