        type: string
        default: WEBM
        enum:
        - WAV
        - WEBM
        - WAV_ULAW
        - OGG_VORBIS
        - OGG_OPUS
        - MP3
        - NONE
      - name: emailFormatId
        in: query
        description: The desired media format when downloading an email recording.
        required: false
        type: string
        default: EML
        enum:
        - EML
        - NONE
      - name: chatFormatId
        in: query
        description: The desired media format when downloading a chat recording.
        required: false
        type: string
        default: ZIP
        enum:
        - ZIP
        - NONE
      - name: messageFormatId
        in: query
        description: The desired media format when downloading a message recording.
        required: false
        type: string
        default: ZIP
        enum:
        - ZIP
        - NONE
