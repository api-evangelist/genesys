        replyToId:
          type: string
          description: The id of the message this public message is replying to.
        source:
          type: string
          description: The source of the public message. Useful when there could be more than location. Channel specific, e.g., for Facebook it's a source page.
        url:
          type: string
          description: The URL of the social post on the native platform.
        mentionIds:
          type: array
          description: IDs of accounts referenced by name within the message text or caption (for example '@brandpage' in a post body or comment). A 'mention' here uses the same convention as Meta (Facebook, Instagram) and LinkedIn, where it denotes a textual reference to an account. Distinct from tagIds, which represent explicit associations with the message. Null or absent when no accounts are referenced in the text.
          items:
            type: string
          maxItems: 1
          minItems: 0
        tagIds:
          type: array
          description: IDs of accounts attached to the message itself, independent of the text (for example a person tagged in an Instagram photo so their profile is linked from the image). A 'tag' here uses the same convention as Meta (Facebook, Instagram) and LinkedIn, where it denotes an explicit association with content rather than a textual reference. Distinct from mentionIds, which represent in-text/caption references. Null or absent when no accounts are tagged on the message.
          items:
            type: string
          maxItems: 1
          minItems: 0
      description: Information about a public message.
