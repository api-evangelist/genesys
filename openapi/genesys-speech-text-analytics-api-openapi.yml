definitions:
  CategoriesEntityListing:
    type: object
    properties:
      entities:
        type: array
        items:
          $ref: '#/definitions/StaCategory'
      pageSize:
        type: integer
        format: int32
      pageNumber:
        type: integer
        format: int32
      total:
        type: integer
        format: int64
      firstUri:
        type: string
        format: uri
      nextUri:
        type: string
        format: uri
      previousUri:
        type: string
        format: uri
      lastUri:
        type: string
        format: uri
      selfUri:
        type: string
        format: uri
      pageCount:
        type: integer
        format: int32
  TopicsEntityListing:
    type: object
    properties:
      entities:
        type: array
        items:
          $ref: '#/definitions/ListedTopic'
      pageSize:
        type: integer
        format: int32
      total:
        type: integer
        format: int32
      nextUri:
        type: string
        format: uri
      selfUri:
        type: string
        format: uri
      pageCount:
        type: integer
        format: int32
  AddressableEntityRef:
    type: object
    properties:
      id:
        type: string
      selfUri:
        type: string
        format: uri
  SentimentInsights:
    type: object
    properties:
      positiveSentimentReasons:
        type: array
        description: The reasons for positive sentiment found in the conversation
        items:
          $ref: '#/definitions/SentimentInsightEntry'
      negativeSentimentReasons:
        type: array
        description: The reasons for negative sentiment found in the conversation
        items:
          $ref: '#/definitions/SentimentInsightEntry'
  EmpathyScore:
    type: object
    properties:
      score:
        type: number
        format: double
        description: Empathy score of the agent involved in the conversation
      userId:
        type: string
        description: UserId of the agent involved in the conversation
  DictionaryFeedbackExamplePhrase:
    type: object
    required:
    - phrase
    properties:
      phrase:
        type: string
        description: The Example Phrase text. At least 3 words and up to 20 words
      source:
        type: string
        description: The source of the given Example Phrase
        enum:
        - Manual
  TestTopicPhrasePhrase:
    type: object
    required:
    - text
    properties:
      text:
        type: string
        description: The phrase text
      strictness:
        type: string
        description: The phrase strictness, default value is null
        enum:
        - '1'
        - '55'
        - '65'
        - '72'
        - '85'
        - '90'
  ListedTopic:
    type: object
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
      description:
        type: string
      published:
        type: boolean
      strictness:
        type: string
        enum:
        - '1'
        - '55'
        - '65'
        - '72'
        - '85'
        - '90'
      matchingType:
        type: string
        enum:
        - Lexical
        - Semantic
      programsCount:
        type: integer
        format: int32
      tags:
        type: array
        items:
          type: string
      dialect:
        type: string
      participants:
        type: string
        enum:
        - External
        - Internal
        - All
      phrasesCount:
        type: integer
        format: int32
      modifiedBy:
        $ref: '#/definitions/AddressableEntityRef'
      dateModified:
        type: string
        format: date-time
        description: 'Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  TopicJobRequest:
    type: object
    required:
    - topicIds
    properties:
      topicIds:
        type: array
        description: The ids of the topics used for this job
        items:
          type: string
  TestTopicPhraseTopic:
    type: object
    required:
    - dialect
    - phrase
    properties:
      phrase:
        description: The topic phrase to test
        $ref: '#/definitions/TestTopicPhrasePhrase'
      strictness:
        type: string
        description: The topic strictness, default value is 72
        enum:
        - '1'
        - '55'
        - '65'
        - '72'
        - '85'
        - '90'
      dialect:
        type: string
        description: The topic dialect, default value is en-US
      participants:
        type: string
        description: The topic participants, default value is both
        enum:
        - External
        - Internal
        - All
  TestTopicPhraseJobRequest:
    type: object
    required:
    - topic
    properties:
      topic:
        description: The topic to test
        $ref: '#/definitions/TestTopicPhraseTopic'
      transcriptsFilters:
        description: The transcripts filters
        $ref: '#/definitions/TranscriptsFilters'
