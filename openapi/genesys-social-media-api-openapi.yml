components:
  schemas:
    SocialMediaStatisticalResponse:
      type: object
      properties:
        interval:
          type: string
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/SocialMediaAggregateMetricData'
    TwitterDataIngestionRuleRequest:
      type: object
      required:
      - name
      - searchTerms
      properties:
        name:
          type: string
          description: The name of the data ingestion rule.
        description:
          type: string
          description: A description of the data ingestion rule.
        searchTerms:
          type: string
          description: Search terms for X (formally Twitter).
        countries:
          type: array
          description: ISO 3166-1 alpha-2 country codes. Ingestion of matching tweets will be restricted to tweets posted in the countries specified here. Defaults to worldwide.
          items:
            type: string
    InstagramDataIngestionRuleResponse:
      type: object
      properties:
        id:
          type: string
          description: ID of the Instagram data ingestion rule.
        name:
          type: string
          description: The name of the data ingestion rule.
        description:
          type: string
          description: A description of the data ingestion rule.
        status:
          type: string
          description: The status of the data ingestion rule.
          enum:
          - Active
          - Deleted
