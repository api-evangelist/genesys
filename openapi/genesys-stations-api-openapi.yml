        in: query
        description: Page size
        required: false
        type: integer
        default: 25
        format: int32
      - name: pageNumber
        in: query
        description: Page number
        required: false
        type: integer
        default: 1
        format: int32
      - name: sortBy
        in: query
        description: Sort by
        required: false
        type: string
        default: name
      - name: name
        in: query
        description: Name
        required: false
        type: string
      - name: userSelectable
        in: query
        description: True for stations that the user can select otherwise false
        required: false
        type: string
      - name: webRtcUserId
        in: query
        description: Filter for the webRtc station of the webRtcUserId
        required: false
        type: string
      - name: id
        in: query
        description: Comma separated list of stationIds
        required: false
        type: string
      - name: lineAppearanceId
