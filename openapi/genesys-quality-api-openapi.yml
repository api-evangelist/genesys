definitions:
  Team:
    type: object
    required:
    - name
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
        description: The team name
      division:
        description: The division to which this entity belongs.
        $ref: '#/definitions/WritableDivision'
      description:
        type: string
        description: Team information.
      dateCreated:
        type: string
        format: date-time
        description: 'Last modified datetime. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        readOnly: true
      dateModified:
        type: string
        format: date-time
        description: 'Last modified datetime. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        readOnly: true
      memberCount:
        type: integer
        format: int64
        description: Number of members in a team
        readOnly: true
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  WorkPlanBidRanks:
    type: object
    properties:
      id:
        type: string
        description: The globally unique identifier for the user.
      workPlanBiddingPerformance:
        type: integer
        format: int32
        description: Work plan bidding agent performance ranking. The range of values is between 0 and 9999.
      biddingTieBreaker:
        type: string
        description: Custom agent ranking metric that some customers can use.
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  AddressableEntityRef:
    type: object
    properties:
      id:
        type: string
      selfUri:
        type: string
        format: uri
  AsyncQueryStatus:
    type: object
    properties:
      state:
        type: string
        description: The current state of the asynchronous query
        enum:
        - QUEUED
        - PENDING
        - FAILED
        - CANCELLED
        - FULFILLED
        - EXPIRED
      errorMessage:
        type: string
        description: The error associated with the current query, if the state is FAILED
      expirationDate:
        type: string
        format: date-time
        description: 'The time at which results for this query will expire. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      submissionDate:
        type: string
        format: date-time
        description: 'The time at which the query was submitted. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
      completionDate:
        type: string
        format: date-time
        description: 'The time at which the query completed. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
  ResourcePermissionPolicy:
    type: object
    properties:
      id:
        type: string
      domain:
        type: string
      entityName:
        type: string
      policyName:
        type: string
      policyDescription:
        type: string
      actionSetKey:
        type: string
      allowConditions:
        type: boolean
      resourceConditionNode:
        $ref: '#/definitions/ResourceConditionNode'
      namedResources:
        type: array
        items:
          type: string
      resourceCondition:
        type: string
      actionSet:
        type: array
        uniqueItems: true
        items:
          type: string
  PublishForm:
    type: object
    required:
    - id
    - published
    properties:
      published:
        type: boolean
        description: Is this form published
      id:
        type: string
        description: Unique Id for this version of this form
  AiScoring:
    type: object
    properties:
      failureType:
        type: string
        description: The type of error that occurred while processing AI scores. It is null where there is no error.
        readOnly: true
        enum:
        - QuotaReached
        - ParsingError
        - ServiceError
        - InvalidRequest
        - DuplicateFormSameAgent
        - Unauthorized
        - DuplicateAutomatedFormWithCopiedScore
      pending:
        type: boolean
        description: Indicates whether AI scoring is currently processing the evaluation.
        readOnly: true
      dateLastChanged:
        type: string
        format: date-time
        description: 'The date when the AI scores were last updated. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        readOnly: true
  WritableDivision:
    type: object
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
      name:
        type: string
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  StatisticalResponse:
    type: object
    properties:
      interval:
        type: string
      metrics:
        type: array
        items:
          $ref: '#/definitions/AggregateMetricData'
      views:
        type: array
        items:
          $ref: '#/definitions/AggregateViewData'
  EvaluationAggregationQueryMe:
    type: object
    required:
    - interval
    - metrics
    properties:
      interval:
        type: string
        format: interval
        description: 'Behaves like one clause in a SQL WHERE. Specifies the date and time range of data being queried. Intervals are represented as an ISO-8601 string. For example: YYYY-MM-DDThh:mm:ss/YYYY-MM-DDThh:mm:ss'
      timeZone:
        type: string
        description: 'Time zone context used to calculate response intervals (this allows resolving DST changes). The interval offset is used even when timeZone is specified. Default is UTC. Time zones are represented as a string of the zone name as found in the IANA time zone database. For example: UTC, Etc/UTC, or Europe/London'
      groupBy:
        type: array
        description: Behaves like a SQL GROUPBY. Allows for multiple levels of grouping as a list of dimensions. Partitions resulting aggregate computations into distinct named subgroups rather than across the entire result set as if it were one group.
        items:
          type: string
          enum:
          - assigneeApplicable
          - assigneeId
          - calibrationId
          - contextId
          - conversationId
          - divisionId
          - evaluationContextId
          - evaluationId
          - evaluatorId
          - formId
          - mediaType
          - queueId
          - released
          - rescored
          - systemSubmitted
          - teamId
          - userId
      metrics:
        type: array
        description: Behaves like a SQL SELECT clause. Only named metrics will be retrieved.
        items:
          type: string
          enum:
          - nEvaluations
          - nEvaluationsDeleted
          - nEvaluationsRescored
          - oTotalCriticalScore
          - oTotalScore
      alternateTimeDimension:
        type: string
        description: Dimension to use as the alternative timestamp for data in the aggregate.  Choosing "eventTime" uses the actual time of the data event.
        enum:
        - conversationStart
        - evaluationCreatedDate
        - evaluationReleaseDate
        - eventTime
      contextId:
        type: string
        description: Evaluation context Id
  AggregateViewData:
    type: object
    properties:
      name:
        type: string
      stats:
        $ref: '#/definitions/StatisticalSummary'
  EvaluationSearchSubAggregationDTO:
    type: object
    required:
    - field
    - name
    - type
    properties:
      name:
        type: string
        description: The name of the aggregation
        minLength: 1
        maxLength: 100
      field:
