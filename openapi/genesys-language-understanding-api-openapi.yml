components:
  schemas:
    NluDomainListing:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/NluDomain'
        pageSize:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        firstUri:
          type: string
          format: uri
        nextUri:
          type: string
          format: uri
        previousUri:
          type: string
          format: uri
        lastUri:
          type: string
          format: uri
        selfUri:
          type: string
          format: uri
        pageCount:
          type: integer
          format: int32
    NluDomainVersionListing:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/NluDomainVersion'
        pageSize:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        firstUri:
          type: string
          format: uri
        nextUri:
          type: string
          format: uri
        previousUri:
          type: string
          format: uri
        lastUri:
          type: string
          format: uri
        selfUri:
          type: string
          format: uri
        pageCount:
          type: integer
          format: int32
    SupportedEntityTypeStatus:
      type: object
      properties:
        listSlotType:
          type: string
          description: The configuration status of restricted lists
          enum:
          - All
          - Restricted
          - Unrestricted
    IgnoreTopic:
      type: object
      required:
      - participant
      - text
      properties:
        text:
          type: string
          example: pay bill
          description: Text of the topic to be ignored
        participant:
          type: string
          example: Customer
          description: Type of participant
          enum:
          - Customer
          - Agent
          - Both
        mediaType:
          type: string
          description: Media Type for the entity (Optional)
          enum:
          - Chat
          - Call
          - Message
          - Email
    NamedEntityDefinition:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
          description: The name of the entity.
        type:
          type: string
          description: The name of the entity type.
    SupportedLanguagesInfoDefinition:
      type: object
      properties:
        language:
          type: string
          description: The given supported Language
        intentClassification:
          type: boolean
          description: The boolean status of if intent classification is supported in this language
        status:
          type: string
          description: The language release status
          enum:
          - EARLY_PREVIEW
          - PREVIEW
          - GA
        supportedEntityTypes:
          type: array
          description: The supported entity types for this language
          items:
            type: string
        supportedEntityTypeConfiguration:
          description: The configuration for the supported entity types
          $ref: '#/components/schemas/SupportedEntityTypeStatus'
    DetectedNamedEntityValue:
      type: object
      properties:
        raw:
          type: string
          description: The raw value of the detected named entity.
          readOnly: true
        resolved:
          type: string
          description: The resolved value of the detected named entity.
          readOnly: true
        unit:
          type: string
          description: The unit of the detected amount of money entity, e.g. EUR, USD.
          readOnly: true
          allowEmptyValue: true
    IntentReference:
      type: object
      required:
      - name
      properties:
        id:
          type: string
          description: ID of the intent.
          readOnly: true
        name:
          type: string
          description: The name of the intent.
    IgnorePhrase:
      type: object
      required:
      - participant
      - text
      properties:
        text:
          type: string
          example: want to pay bill
          description: Text of the phrase to be ignored
        participant:
          type: string
          example: Customer
          description: Type of participant
          enum:
          - Customer
          - Agent
          - Both
        mediaType:
          type: string
          description: Media Type for the entity (Optional)
          enum:
          - Chat
          - Call
          - Message
          - Email
    DetectedIntent:
      type: object
      properties:
        name:
          type: string
          description: The name of the detected intent.
          readOnly: true
        probability:
          type: number
          format: double
          description: The probability of the detected intent.
          readOnly: true
        entities:
          type: array
          description: The collection of named entities detected.
          readOnly: true
          items:
            $ref: '#/components/schemas/DetectedNamedEntity'
    MinerTopicsListing:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/MinerTopic'
        nextUri:
          type: string
        selfUri:
          type: string
        previousUri:
          type: string
    NluDetectionInput:
      type: object
      required:
      - text
      properties:
        text:
          type: string
          description: The text to perform NLU detection on.
        language:
          type: string
          description: Language of the version for multilingual detection, e.g. `en-us`, `de-de`
    NamedEntityTypeDefinition:
      type: object
      required:
      - mechanism
      - name
      properties:
        name:
          type: string
          description: The name of the entity type.
        description:
          type: string
          description: Description of the of the named entity type.
        mechanism:
          description: The mechanism enabling detection of the named entity type.
          $ref: '#/components/schemas/NamedEntityTypeMechanism'
    NluDomain:
      type: object
      required:
      - name
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
          readOnly: true
        name:
          type: string
          description: The name of the NLU domain.
        language:
          type: string
          description: The language culture of the NLU domain, e.g. `en-us`, `de-de`.
        draftVersion:
          description: The draft version of that NLU domain.
          readOnly: true
          $ref: '#/components/schemas/NluDomainVersionReference'
        lastPublishedVersion:
          description: The last published version of that NLU domain.
          readOnly: true
          $ref: '#/components/schemas/NluDomainVersionReference'
        dateCreated:
          type: string
          format: date-time
          description: 'The date when the NLU domain was created. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
        dateModified:
          type: string
          format: date-time
          description: 'The date when the NLU domain was updated. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
        engineVersion:
          type: string
          description: The version of the NLU engine to use.
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    NluDetectionContext:
      type: object
      properties:
        intent:
          description: Restrict detection to this intent.
          $ref: '#/components/schemas/ContextIntent'
        entity:
          description: Use this entity to restrict detection.
          $ref: '#/components/schemas/ContextEntity'
    NluOrganization:
      type: object
      properties:
        limits:
          type: object
          description: The NLU limits defined for this Organization
          additionalProperties:
            type: integer
            format: int32
        supportedLanguagesInfo:
          type: array
          description: The list of Supported features for each languages for this Organization
          items:
            $ref: '#/components/schemas/SupportedLanguagesInfoDefinition'
    NluDomainVersion:
      type: object
      required:
      - language
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
          readOnly: true
        domain:
          description: The NLU domain of the version.
          readOnly: true
          $ref: '#/components/schemas/NluDomain'
        description:
          type: string
          description: The description of the NLU domain version.
        language:
          type: string
          description: The language that the NLU domain version supports.
        published:
          type: boolean
          description: Whether this NLU domain version has been published.
          readOnly: true
        dateCreated:
          type: string
          format: date-time
          description: 'The date when the NLU domain version was created. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
        dateModified:
          type: string
          format: date-time
          description: 'The date when the NLU domain version was updated. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
        dateTrained:
          type: string
          format: date-time
          description: 'The date when the NLU domain version was trained. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
        datePublished:
          type: string
          format: date-time
          description: 'The date when the NLU domain version was published. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
        trainingStatus:
          type: string
          description: The training status of the NLU domain version.
          readOnly: true
          enum:
          - Untrained
          - Training
          - Trained
          - Error
          - Unknown
        evaluationStatus:
          type: string
          description: The evaluation status of the NLU domain version.
          readOnly: true
          enum:
          - Unevaluated
          - Evaluating
          - Evaluated
          - Error
        intents:
          type: array
          description: The intents defined for this NLU domain version.
          items:
            $ref: '#/components/schemas/IntentDefinition'
        entityTypes:
          type: array
          description: The entity types defined for this NLU domain version.
          items:
            $ref: '#/components/schemas/NamedEntityTypeDefinition'
        entities:
          type: array
          description: The entities defined for this NLU domain version.This field is mutually exclusive with entityTypeBindings
          items:
            $ref: '#/components/schemas/NamedEntityDefinition'
        languageVersions:
          type: object
          description: Map of language code to NLU domain version UUID for multilingual domains.
          readOnly: true
          additionalProperties:
            type: string
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    DraftTopics:
      type: object
      required:
      - id
      - phrases
      properties:
        id:
          type: string
          description: Id for a topic.
        name:
          type: string
          description: Topic name.
        miner:
          description: The miner to which the topic belongs.
          readOnly: true
          $ref: '#/components/schemas/Miner'
        conversationCount:
