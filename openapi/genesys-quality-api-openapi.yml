        in: query
        description: Previous page token
        required: false
        type: string
      - name: conversationId
        in: query
        description: conversationId specified
        required: false
        type: string
      - name: agentUserId
        in: query
        description: user id of the agent
        required: false
        type: string
      - name: agentTeamId
        in: query
        description: team id of the agent
        required: false
        type: string
      - name: evaluatorUserId
        in: query
        description: evaluator user id
        required: false
        type: string
      - name: assigneeUserId
        in: query
        description: assignee user id
        required: false
        type: string
      - name: queueId
        in: query
        description: queue id
        required: false
        type: string
      - name: startTime
        in: query
        description: start time of the evaluation query
