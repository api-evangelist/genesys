components:
  schemas:
    SummarySettingParticipantLabels:
      type: object
      properties:
        internal:
          type: string
          description: Specify how to refer the internal participant of the interaction.
        external:
          type: string
          description: Specify how to refer the external participant of the interaction.
    UploadUrlResponse:
      type: object
      properties:
        url:
          type: string
          description: Presigned URL to PUT the file to
          readOnly: true
        uploadKey:
          type: string
          description: Key that identifies the file in the storage including the file name
          readOnly: true
        headers:
          type: object
          description: Required headers when uploading a file through PUT request to the URL
          readOnly: true
          additionalProperties:
            type: string
    VariableValidation:
      type: object
    Guide:
      type: object
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
          readOnly: true
        name:
          type: string
          description: The name of the guide.
          readOnly: true
        status:
          type: string
          description: The status of the guide.
          readOnly: true
          enum:
          - Published
          - Draft
        source:
          type: string
          description: Indicates how the guide content was generated.
          readOnly: true
          enum:
          - Manual
          - Prompt
          - Document
          - Transcripts
        dateCreated:
          type: string
          format: date-time
          description: 'The date and time the guide was created. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
        dateModified:
          type: string
          format: date-time
          description: 'The date and time the guide was last modified. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
        latestSavedVersion:
          description: The latest saved version of the guide.
          readOnly: true
          $ref: '#/components/schemas/GuideVersionRef'
        latestProductionReadyVersion:
          description: The latest production ready version of the guide.
          readOnly: true
          $ref: '#/components/schemas/GuideVersionRef'
    GuideEntityListing:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Guide'
        pageSize:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        firstUri:
          type: string
          format: uri
        nextUri:
          type: string
          format: uri
        previousUri:
          type: string
          format: uri
        lastUri:
          type: string
          format: uri
        selfUri:
          type: string
          format: uri
        pageCount:
          type: integer
          format: int32
    SummarySettingCustomEntity:
      type: object
      properties:
        label:
          type: string
          description: Label how the entity should be called.
        description:
          type: string
          description: Describe the information the entity captures.
    GuideVersion:
      type: object
      properties:
        selfUri:
          type: string
          format: uri
        guide:
          description: The guide this version belongs to.
          readOnly: true
          $ref: '#/components/schemas/AddressableEntityRef'
        version:
          type: string
          description: Guide version.
          readOnly: true
        instruction:
          type: string
          description: The instruction given to this version of the guide, for how it should behave when interacting with a User.
          readOnly: true
        state:
          type: string
          description: The current state of the guide version.
          enum:
          - Draft
          - TestReady
          - ProductionReady
        dateCreated:
          type: string
          format: date-time
          description: 'The date and time the guide version was created. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
