        readOnly: true
      name:
        type: string
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  GreetingOwner:
    type: object
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
      selfUri:
        type: string
        format: uri
        description: The URI for this object
        readOnly: true
  Greeting:
    type: object
    required:
    - owner
    - ownerType
    - type
    properties:
      id:
        type: string
        description: The globally unique identifier for the object.
        readOnly: true
      name:
        type: string
      type:
        type: string
        description: Greeting type
        enum:
        - STATION
        - VOICEMAIL
        - NAME
      ownerType:
        type: string
        description: Greeting owner type
        enum:
        - USER
        - ORGANIZATION
        - GROUP
