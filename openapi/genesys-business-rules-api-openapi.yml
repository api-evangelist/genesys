components:
  schemas:
    CopyDecisionTableRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: The name of the newly created decision table. Must be unique
        description:
          type: string
          description: The description of newly created decision table.
    UpdateDecisionTableColumnsRequest:
      type: object
      properties:
        inputs:
          type: array
          description: The input columns of the decision table.
          items:
            $ref: '#/components/schemas/DecisionTableInputColumnRequest'
          maxItems: 2147483647
          minItems: 1
        outputs:
          type: array
          description: The output columns of the decision table.
          items:
            $ref: '#/components/schemas/DecisionTableOutputColumnRequest'
          maxItems: 2147483647
          minItems: 1
      description: Decision table columns will equal the columns contained in this request after the update is performed. If a list of columns types is not provided (i.e. is null) then no update is performed for that column type
    CreateDecisionTableColumnsRequest:
      type: object
      required:
      - inputs
      - outputs
      properties:
        inputs:
          type: array
          description: The input columns of the decision table.
          items:
            $ref: '#/components/schemas/DecisionTableInputColumnRequest'
          maxItems: 2147483647
          minItems: 1
        outputs:
          type: array
          description: The output columns of the decision table.
          items:
            $ref: '#/components/schemas/DecisionTableOutputColumnRequest'
          maxItems: 2147483647
          minItems: 1
    DecisionTableImportJob:
      type: object
      required:
      - importMode
      - status
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
          readOnly: true
        tableVersion:
          type: integer
          format: int32
          description: The table version to be replaced by this import
        status:
          type: string
          description: Current status of the import job
          enum:
          - Uploading
          - Processing
          - Complete
          - Failed
          - Cancelled
        uploadUrl:
          type: string
          description: Pre-signed URL to upload the import file (PUT)
        uploadHeaders:
          type: object
          description: Headers required when uploading file with data to be imported to uploadUrl
          additionalProperties:
            type: string
        importMode:
          type: string
          description: Whether rows are appended to existing rows or rows are replaced
          enum:
          - Append
          - Replace
        fileName:
          type: string
          description: Original file name supplied when the job was created, including the file extension
        createdBy:
          description: The user who created the job
          readOnly: true
          $ref: '#/components/schemas/AddressableEntityRef'
        dateCreated:
          type: string
          format: date-time
          description: 'When the job was created. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        dateModified:
          type: string
          format: date-time
          description: 'When the job was last updated. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        dateCompleted:
          type: string
          format: date-time
          description: 'When processing finished, successfully or not. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        dateExpires:
          type: string
          format: date-time
          description: 'When upload credentials expire. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        rowMetrics:
          description: Row-level metrics populated incrementally during import processing
          $ref: '#/components/schemas/DecisionTableImportRowMetrics'
        error:
          description: Present when the import job could not be successfully finished
          $ref: '#/components/schemas/DecisionTableImportJobError'
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
      description: State of a decision table row import job
    BusinessRulesSchemaCreateRequest:
      type: object
      required:
      - jsonSchema
      properties:
        jsonSchema:
          description: A JSON schema defining the extension to the built-in entity type.
          $ref: '#/components/schemas/JsonSchemaWithDefinitions'
      description: Request to create a new Business Rules Schema
    DecisionTableImportJobListing:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/DecisionTableImportJob'
        nextUri:
          type: string
        selfUri:
          type: string
        previousUri:
          type: string
    DecisionTableInputColumn:
      type: object
      required:
      - expression
      properties:
        id:
          type: string
          description: The id of the column.
          readOnly: true
        defaultsTo:
          description: The default row value for this column that will complete the condition expression where no value is provided by a row.
          $ref: '#/components/schemas/DecisionTableColumnDefaultRowValue'
        expression:
          description: The input column condition expression, comprising the left side and comparator of a logical condition in the form of left|comparator|right, where each row of the decision table will provide the right side to form a complete condition
          $ref: '#/components/schemas/DecisionTableInputColumnExpression'
    Division:
      type: object
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
          readOnly: true
        name:
          type: string
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    DecisionTableRow:
      type: object
      required:
      - table
      properties:
        id:
          type: string
          description: The globally unique identifier for the object.
          readOnly: true
        table:
          description: The decision table to which this row belongs
          $ref: '#/components/schemas/DecisionTableVersionEntity'
        rowIndex:
          type: integer
          format: int32
          description: The absolute index of this row in the decision table, starting at 1
        dateCreated:
          type: string
          format: date-time
          description: 'The date when this row was created. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        dateModified:
          type: string
          format: date-time
          description: 'The date when this row was last modified. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        inputs:
          type: object
          description: The map input values of the row being created. At least one value must be provided. The key for this map is the column ID the row value relates
          additionalProperties:
            $ref: '#/components/schemas/DecisionTableRowParameterValue'
        outputs:
          type: object
          description: The map output values of the row being created. At least one value must be provided. The key for this map is the column ID the row value relates
          additionalProperties:
            $ref: '#/components/schemas/DecisionTableRowParameterValue'
        selfUri:
          type: string
          format: uri
          description: The URI for this object
          readOnly: true
    MinLength:
      type: object
      required:
      - max
      - min
      properties:
        min:
          type: integer
          format: int64
          description: A non-negative integer for a text-based schema field denoting the minimum smallest length a string field can contain for a schema instance.
        max:
          type: integer
          format: int64
          description: A non-negative integer for a text-based schema field denoting the maximum smallest length string the field can contain for a schema instance.
    DecisionTableColumns:
      type: object
      properties:
        inputs:
          type: array
          description: The input columns of the decision table.
          items:
            $ref: '#/components/schemas/DecisionTableInputColumn'
        outputs:
          type: array
          description: The output columns of the decision table.
          items:
            $ref: '#/components/schemas/DecisionTableOutputColumn'
    SearchDecisionTableRowsRequest:
      type: object
      required:
      - filter
      properties:
        filter:
          description: The filter criteria for searching decision table rows
          $ref: '#/components/schemas/RowSearchFilter'
    BulkUpdateDecisionTableRowsResponse:
      type: object
      required:
      - rows
      - totalUpdated
      properties:
        totalUpdated:
          type: integer
          format: int32
          description: The total number of rows successfully updated
        rows:
          type: array
          description: The list of updated decision table rows
          items:
            $ref: '#/components/schemas/DecisionTableRow'
    CreateDecisionTableVersionRequest:
      type: object
      properties:
        sourceVersion:
          type: integer
          format: int32
          description: The published, superseded, or snapshot version to create the new draft from. When not provided or null, the published version is used. Must be at least 1 when provided.
          minimum: 1
    UpdateDecisionTableVersionRequest:
      type: object
      properties:
