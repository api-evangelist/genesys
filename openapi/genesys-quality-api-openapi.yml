  /api/v2/quality/agents/activity:
    get:
      tags:
      - Quality
      summary: Gets a list of Agent Activities
      description: Each item on the list shows one agent's evaluation activity comprised of the number of evaluations and the highest, average, and lowest standard and critical scores, as well as a sub list showing the number and average score of evaluations for each evaluator for that agent.  evaluatorUserId, startTime, and endTime are all filtering criteria. If specified, the only evaluations used to compile the agent activity response will be ones that match the filtering criteria. agentUserId, name, group, and agentTeamId are all agent selection criteria. criteria.  If one or more agent selection criteria are specified, then the returned activity will include users that match the criteria even if those users did not have any agent activity or evaluations that do not match any filtering criteria.  If no agent selection criteria are specified but an evaluatorUserId is, then the returned activity will be only for those agents that had evaluations where the evaluator is the evaluatorUserId.  If no agent selection criteria are specified and no evaluatorUserId is specified, then the returned activity will be for all users
      operationId: getQualityAgentsActivity
      produces:
      - application/json
      parameters:
      - name: pageSize
        in: query
        description: The total page size requested
        required: false
        type: integer
        default: 25
        format: int32
      - name: pageNumber
        in: query
        description: The page number requested
        required: false
        type: integer
        default: 1
        format: int32
      - name: sortBy
        in: query
        description: variable name requested to sort by
        required: false
        type: string
      - name: expand
        in: query
        description: variable name requested by expand list
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
      - name: nextPage
        in: query
        description: next page token
        required: false
        type: string
      - name: previousPage
        in: query
        description: Previous page token
        required: false
        type: string
      - name: startTime
        in: query
        description: 'Start time of agent activity based on assigned date. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        required: false
        type: string
        format: date-time
      - name: endTime
        in: query
        description: 'End time of agent activity based on assigned date. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
        required: false
        type: string
        format: date-time
      - name: agentUserId
        in: query
        description: user id of agent requested
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
      - name: evaluatorUserId
        in: query
        description: user id of the evaluator
        required: false
        type: string
      - name: name
        in: query
        description: name
        required: false
        type: string
      - name: group
        in: query
        description: group id
        required: false
        type: string
      - name: agentTeamId
        in: query
        description: team id of agents requested
        required: false
        type: string
      - name: formContextId
        in: query
        description: shared id between form versions
        required: false
        type: string
      - name: userState
        in: query
        description: "'Legacy' fetches active and inactive users when evaluatorUserId or no user filters are supplied; otherwise fetches active users. \n'Any' fetches users of 'active', 'inactive' and 'deleted' states."
        required: false
        type: string
        default: Legacy
        enum:
        - Any
