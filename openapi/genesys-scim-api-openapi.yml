  /api/v2/scim/groups:
    get:
      tags:
      - SCIM
      summary: Get a list of groups
      description: ''
      operationId: getScimGroups
      consumes:
      - application/scim+json
      - application/json
      produces:
      - application/scim+json
      - application/json
      parameters:
      - name: startIndex
        in: query
        description: The 1-based index of the first query result.
        required: false
        type: integer
        default: 1
        format: int32
      - name: count
        in: query
        description: The requested number of items per page. A value of 0 returns "totalResults". A page size over 25 may exceed internal resource limits and return a 429 error. For a page size over 25, use the "excludedAttributes" or "attributes" query parameters to exclude or only include secondary lookup values such as "externalId",  "roles", "urn:ietf:params:scim:schemas:extension:genesys:purecloud:2.0:User:routingLanguages", or "urn:ietf:params:scim:schemas:extension:genesys:purecloud:2.0:User:routingSkills".
        required: false
        type: integer
        default: 25
        format: int32
      - name: attributes
        in: query
        description: Indicates which attributes to include. Returns these attributes and the "id", "active", and "meta" attributes. Use "attributes" to avoid expensive secondary calls for the default attributes.
        required: false
        type: array
        items:
          type: string
          enum:
          - id
          - displayName
          - members
          - externalId
          - meta
          - meta.version
          - meta.lastModified
          - urn:ietf:params:scim:schemas:core:2.0:Group:id
          - urn:ietf:params:scim:schemas:core:2.0:Group:meta
          - urn:ietf:params:scim:schemas:core:2.0:Group:meta.version
          - urn:ietf:params:scim:schemas:core:2.0:Group:meta.lastModified
          - urn:ietf:params:scim:schemas:core:2.0:Group:displayName
          - urn:ietf:params:scim:schemas:core:2.0:Group:members
          - urn:ietf:params:scim:schemas:core:2.0:Group:externalId
        collectionFormat: multi
      - name: excludedAttributes
        in: query
        description: Indicates which attributes to exclude. Returns the default attributes minus "excludedAttributes". Always returns "id", "active", and "meta" attributes. Use "excludedAttributes" to avoid expensive secondary calls for the default attributes.
        required: false
        type: array
        items:
          type: string
          enum:
          - id
          - displayName
          - members
          - externalId
          - meta
          - meta.version
          - meta.lastModified
          - urn:ietf:params:scim:schemas:core:2.0:Group:id
          - urn:ietf:params:scim:schemas:core:2.0:Group:meta
          - urn:ietf:params:scim:schemas:core:2.0:Group:meta.version
          - urn:ietf:params:scim:schemas:core:2.0:Group:meta.lastModified
          - urn:ietf:params:scim:schemas:core:2.0:Group:displayName
          - urn:ietf:params:scim:schemas:core:2.0:Group:members
          - urn:ietf:params:scim:schemas:core:2.0:Group:externalId
        collectionFormat: multi
      - name: filter
        in: query
        description: 'Filters results. If nothing is specified, returns all groups. Examples of valid values: "id eq 5f4bc742-a019-4e38-8e2a-d39d5bc0b0f3", "displayname eq Sales".'
        required: false
        type: string
        x-example: displayName eq groupName
      responses:
