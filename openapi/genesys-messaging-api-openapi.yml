components:
  schemas:
    InboundOnlySetting:
      type: object
      properties:
        inbound:
          type: string
          enum:
          - Enabled
          - Disabled
    MessagingConfigListing:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/MessagingSetting'
        pageSize:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        firstUri:
          type: string
          format: uri
        nextUri:
          type: string
          format: uri
        previousUri:
          type: string
          format: uri
        lastUri:
          type: string
          format: uri
        selfUri:
          type: string
          format: uri
        pageCount:
          type: integer
          format: int32
    EventSetting:
      type: object
      properties:
        typing:
          description: Settings regarding typing events
          $ref: '#/components/schemas/TypingSetting'
    MessagingSetting:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: The messaging Setting unique identifier associated with this integration
          readOnly: true
        name:
          type: string
          description: The messaging Setting profile name
        dateCreated:
          type: string
          format: date-time
          description: 'Date this messaging setting was created. Date time is represented as an ISO-8601 string. For example: yyyy-MM-ddTHH:mm:ss[.mmm]Z'
          readOnly: true
